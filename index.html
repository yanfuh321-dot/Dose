<!doctype html>
<html lang="en">
<head>

<meta name="description" content="Personal supplement plan, lab results and check-up schedule">

<meta name="theme-color" content="#111815" media="(prefers-color-scheme: dark)">

<style>
/* ---------- Base ---------- */
:root {
  --paper: #F1F4EF;
  --surface: #FFFFFF;
  --surface-2: #E6EBE4;
  --ink: #18291F;
  --ink-2: #4A5B52;
  --ink-3: #75867D;
  --line: #D3DBD2;
  --accent: #1E5A4B;
  --accent-hover: #174A3D;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEAE3;

  --s-nuechtern: #E5C26A;
  --s-fruehstueck: #DD923A;
  --s-mittag: #6CA67A;
  --s-abend: #AE6188;
  --s-schlaf: #3E4B8A;
  --s-none: #A9B4AE;

  --danger: #A3312A; --danger-bg: #FBEAE7;
  --warn: #8A5D0E;   --warn-bg: #FBF0D8;
  --timing: #285C9A; --timing-bg: #E5EDF8;
  --info: #52615A;   --info-bg: #EAEFEA;
  --good: #286B42;   --good-bg: #E1F1E6;

  --serif: "Iowan Old Style", "Charter", "Bitstream Charter", "Sitka Text", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Noto Serif", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --nav-h: 62px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #111815;
    --surface: #18211D;
    --surface-2: #212C27;
    --ink: #E2EAE5;
    --ink-2: #A8B7AF;
    --ink-3: #7D8E85;
    --line: #2C3832;
    --accent: #79C2A8;
    --accent-hover: #93D3BC;
    --accent-ink: #0C1A15;
    --accent-soft: #1C3A30;
    --s-nuechtern: #D6B75E;
    --s-fruehstueck: #D98A33;
    --s-mittag: #6EAD7D;
    --s-abend: #C27AA2;
    --s-schlaf: #7F8DD2;
    --s-none: #5E6B65;
    --danger: #F09A90; --danger-bg: #3A201C;
    --warn: #E5BE69;   --warn-bg: #33291A;
    --timing: #8FB7EA; --timing-bg: #1A2940;
    --info: #A8B7AF;   --info-bg: #212C27;
    --good: #87CFA0;   --good-bg: #183020;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--paper); }
body {
  margin: 0; min-height: 100vh;
  background: var(--paper); color: var(--ink);
  font: 16px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
}
body.noscroll { overflow: hidden; }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
h1, h2 { font-family: var(--serif); font-weight: 600; letter-spacing: -0.005em; }
h1 { font-size: 30px; line-height: 1.15; margin: 0 0 6px; }
h2 { font-size: 22px; line-height: 1.2; margin: 0 0 12px; }
h3 { font-size: 16px; line-height: 1.3; margin: 0 0 8px; font-weight: 650; }
p { margin: 0 0 10px; }
a { color: var(--accent); }
.muted { color: var(--ink-3); }
.small { font-size: 13.5px; }
.hint { font-size: 13.5px; color: var(--ink-2); margin: 4px 0 10px; }
.lead { color: var(--ink-2); margin: 0; max-width: 62ch; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Layout ---------- */
.app { min-height: 100vh; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 18px 10px;
  background: var(--paper);
  background: color-mix(in srgb, var(--paper) 90%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--serif); font-size: 23px; font-weight: 600; color: var(--ink); text-decoration: none; letter-spacing: 0.01em; }
.brand-mark { width: 26px; height: 26px; }
.brand-mark .h1 { fill: var(--s-nuechtern); stroke: none; }
.brand-mark .h2 { fill: var(--accent); stroke: none; }
.syncchip { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); text-decoration: none; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.syncchip i { width: 8px; height: 8px; border-radius: 50%; background: var(--s-none); }
.syncchip.s-ok i { background: var(--good); }
.syncchip.s-laeuft i { background: var(--timing); animation: pulse 1s ease-in-out infinite alternate; }
.syncchip.s-fehler { color: var(--danger); border-color: currentColor; }
.syncchip.s-fehler i { background: var(--danger); }
.syncchip.s-offline i { background: var(--warn); }
@keyframes pulse { from { opacity: .35; } to { opacity: 1; } }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--line);
}
.nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; color: var(--ink-3); text-decoration: none; font-size: 10.5px; font-weight: 550; border-radius: 10px; min-width: 0; }
.nav a span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav a[aria-current="page"] { color: var(--accent); }
.nav a[aria-current="page"] svg { stroke-width: 2.1; }

main { max-width: 1060px; margin: 0 auto; padding: 22px 18px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom, 0px)); }

@media (min-width: 960px) {
  .app { display: grid; grid-template-columns: 216px 1fr; grid-template-rows: auto 1fr; }
  .topbar { grid-column: 1 / -1; padding-left: 26px; padding-right: 26px; }
  .nav {
    position: sticky; top: 62px; align-self: start; height: calc(100vh - 62px);
    display: flex; flex-direction: column; gap: 2px; padding: 22px 14px;
    background: transparent; border-top: 0; border-right: 1px solid var(--line);
  }
  .nav a { flex-direction: row; gap: 11px; font-size: 15px; padding: 9px 12px; color: var(--ink-2); }
  .nav a:hover { background: var(--surface-2); color: var(--ink); }
  .nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
  main { padding: 34px 40px 60px; margin: 0; width: 100%; }
  h1 { font-size: 36px; }
}

/* ---------- Headers, sections ---------- */
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 22px; }
.page-head > div { min-width: 0; }
.block { margin: 34px 0; }
.block > h2 .count { font-family: var(--sans); font-size: 14px; font-weight: 600; color: var(--ink-3); margin-left: 4px; vertical-align: 2px; }
.empty, .empty-hero { padding: 20px 0; }
.empty-hero h1 { margin-bottom: 12px; }
.empty-hero .lead { font-size: 18px; margin-bottom: 22px; }
.empty-hero .actions { margin-bottom: 18px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 42px; padding: 9px 16px; border-radius: 10px;
  font: 600 15px/1.2 var(--sans); color: var(--ink); text-decoration: none; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line);
  transition: background-color .15s, border-color .15s;
}
.btn svg { width: 18px; height: 18px; stroke-width: 2.2; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger-ghost { color: var(--danger); border-color: transparent; background: transparent; }
.btn.danger-ghost:hover { background: var(--danger-bg); }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.is-busy { opacity: .6; pointer-events: none; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
.linklike { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer; }
.page-head .btn.primary span { display: inline; }

/* ---------- Daily plan ---------- */
.dayplan { display: grid; margin: 6px 0 10px; }
.slot { display: grid; grid-template-columns: 10px 1fr; column-gap: 16px; }
.slot::before { content: ""; grid-row: 1 / span 2; background: var(--slot); }
.slot:first-child::before { border-radius: 5px 5px 0 0; }
.slot:last-child::before { border-radius: 0 0 5px 5px; }
.slot-head { display: flex; align-items: baseline; gap: 10px; padding: 14px 0 8px; }
.slot-name { font-family: var(--serif); font-size: 19px; font-weight: 600; margin: 0; }
.slot-hint { font-size: 13px; color: var(--ink-3); }
.slot-items { list-style: none; margin: 0; padding: 0 0 16px; display: grid; gap: 8px; }
.slot-empty { margin: 0; padding: 0 0 16px; font-size: 14px; color: var(--ink-3); }
.dayplan.intro .slot::before { animation: grow .55s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i) * 70ms); transform-origin: top; }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }

.dose {
  display: grid; gap: 2px; width: 100%; text-align: left; cursor: pointer;
  padding: 11px 13px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line); color: var(--ink); font: inherit;
}
.dose:hover { border-color: var(--ink-3); }
.dose-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.dose-name { font-weight: 650; line-height: 1.3; }
.dose-amt { font-size: 14px; color: var(--ink-2); }
.dose-ing { font-size: 13px; color: var(--ink-3); line-height: 1.4; }
.flag { flex: none; display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; font-size: 12.5px; font-weight: 700; }
.flag-danger { background: var(--danger); color: #fff; }
.flag-warn { background: var(--warn-bg); color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn); }
.flag-timing { background: var(--timing-bg); color: var(--timing); box-shadow: inset 0 0 0 1px var(--timing); }
.loose { margin: 8px 0 0; padding: 14px 16px 2px; border: 1px dashed var(--line); border-radius: 12px; }
.loose h3 { font-size: 15px; color: var(--ink-2); }

@media (min-width: 760px) {
  .dayplan { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  .slot { grid-template-columns: 1fr; grid-template-rows: 8px auto 1fr; }
  .slot::before, .slot:first-child::before, .slot:last-child::before { grid-row: 1; border-radius: 4px; }
  .dayplan.intro .slot::before { transform-origin: left; animation-name: growx; }
  .slot-head { flex-direction: column; gap: 0; padding: 12px 0 10px; }
  .slot-name { font-size: 18px; }
}
@keyframes growx { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* ---------- Notes ---------- */
.findings { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.finding { padding: 13px 15px 12px; border-radius: 12px; background: var(--sevbg); border-left: 4px solid var(--sevc); }
.f-danger { --sevc: var(--danger); --sevbg: var(--danger-bg); }
.f-warn { --sevc: var(--warn); --sevbg: var(--warn-bg); }
.f-timing { --sevc: var(--timing); --sevbg: var(--timing-bg); }
.f-info { --sevc: var(--ink-3); --sevbg: var(--info-bg); }
.f-good { --sevc: var(--good); --sevbg: var(--good-bg); }
.f-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.sev { font-size: 12.5px; font-weight: 700; color: var(--sevc); }
.f-tag { font-size: 12.5px; color: var(--ink-3); }
.f-tag::before { content: "/"; margin-right: 8px; color: var(--line); }
.f-title { font-weight: 650; margin: 0 0 3px; }
.f-text { margin: 0; color: var(--ink-2); font-size: 15px; }
.f-supps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.tag-btn { font: 600 13px/1 var(--sans); padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.tag-btn:hover { color: var(--ink); border-color: var(--ink-3); }
.allgood { padding: 13px 15px; border-radius: 12px; background: var(--good-bg); color: var(--good); font-weight: 600; margin: 0; }
details.more { margin-top: 14px; }
details.more > summary { cursor: pointer; font-weight: 600; color: var(--ink-2); padding: 6px 0; }
details.more > .findings { margin-top: 10px; }
.findings.compact .finding { padding: 10px 12px; }

/* ---------- Daily amounts ---------- */
.totals { display: grid; gap: 0; border-top: 1px solid var(--line); }
.trow { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; padding: 11px 0; border-bottom: 1px solid var(--line); align-items: center; }
.t-name { font-weight: 600; }
.t-val { font-variant-numeric: tabular-nums; font-weight: 650; text-align: right; }
.t-bar { grid-column: 1 / -1; position: relative; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: visible; }
.t-bar span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }
.t-bar i { position: absolute; left: 66.67%; top: -3px; bottom: -3px; width: 2px; background: var(--ink-2); border-radius: 1px; }
.t-near .t-bar span { background: var(--warn); }
.t-over .t-bar span { background: var(--danger); }
.t-over .t-val { color: var(--danger); }
.t-ul { grid-column: 1 / -1; font-size: 13px; color: var(--ink-3); }
@media (min-width: 760px) {
  .trow { grid-template-columns: minmax(150px, 1.1fr) 110px minmax(160px, 2fr) minmax(170px, 1.3fr); }
  .t-bar, .t-ul { grid-column: auto; }
  .t-ul { text-align: right; }
}

/* ---------- Durations ---------- */
.durations { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.durations li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.d-name { font-weight: 600; }
.d-txt { font-size: 14px; color: var(--ink-2); text-align: right; }
.d-bar { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--surface-2); position: relative; }
.d-bar span { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--s-mittag); }
.d-bar.done span { background: var(--warn); }

/* ---------- Supplement list ---------- */
.supp-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.supp-row {
  display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; width: 100%;
  padding: 14px 4px; background: none; border: 0; border-bottom: 1px solid var(--line);
  text-align: left; font: inherit; color: var(--ink); cursor: pointer;
}
.supp-row:hover { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
.sr-dots { display: grid; grid-template-rows: repeat(5, 6px); gap: 3px; padding-top: 4px; }
.sr-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--slot); }
.sr-dots i.off { background: var(--surface-2); }
.sr-main { display: grid; gap: 2px; min-width: 0; }
.sr-name { font-weight: 650; }
.sr-brand { font-weight: 400; color: var(--ink-3); margin-left: 8px; font-size: 14px; }
.sr-ing { font-size: 14px; color: var(--ink-2); }
.sr-when { grid-column: 2; display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 13.5px; }
@media (min-width: 760px) {
  .supp-row { grid-template-columns: auto 1fr auto; align-items: start; padding: 14px 10px; }
  .sr-when { grid-column: 3; flex-direction: column; align-items: flex-end; text-align: right; }
}

/* ---------- Forms ---------- */
.field { display: grid; gap: 5px; font-size: 14px; color: var(--ink-2); margin: 0 0 12px; min-width: 0; }
.field > span { font-weight: 550; }
input, select, textarea {
  width: 100%; min-height: 44px; padding: 10px 12px;
  font: 16px/1.4 var(--sans); color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
textarea { resize: vertical; min-height: 64px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
input[type="date"] { min-width: 0; }
.grid2, .grid3, .grid4 { display: grid; gap: 0 14px; grid-template-columns: 1fr; }
@media (min-width: 620px) {
  .grid2 { grid-template-columns: 1fr 1fr; }
  .grid3 { grid-template-columns: repeat(3, 1fr); }
  .grid4 { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 619px) {
  .grid4 { grid-template-columns: 1fr 1fr; }
  .grid3 { grid-template-columns: 1fr 1fr; }
  .grid3 > .field:first-child:nth-last-child(3) { grid-column: 1 / -1; }
}
.form-block { max-width: 820px; }
fieldset.group { border: 0; padding: 0; margin: 6px 0 18px; min-width: 0; }
fieldset.group > legend { font-weight: 650; font-size: 16px; padding: 0; margin-bottom: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 12px; }
.chip { position: relative; display: inline-flex; }
.chip input { position: absolute; inset: 0; opacity: 0; margin: 0; min-height: 0; cursor: pointer; }
.chip span {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 13px; border-radius: 999px; font-size: 14.5px; color: var(--ink-2);
  border: 1px solid var(--line); background: var(--surface); user-select: none;
}
.chip input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.slotchip span::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--slot); box-shadow: 0 0 0 1.5px var(--surface); }
.chip-btn { font: 500 14px/1.2 var(--sans); padding: 8px 12px; border-radius: 999px; border: 1px dashed var(--line); background: transparent; color: var(--ink-2); cursor: pointer; }
.chip-btn:hover { border-style: solid; color: var(--ink); }
.quick { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
.rows { display: grid; gap: 4px; }
.rowline { display: grid; gap: 0 10px; align-items: end; }
.med-row { grid-template-columns: 1fr 1fr; }
.med-row .field:first-child { grid-column: 1 / -1; }
.med-row .icon-btn { margin-bottom: 14px; justify-self: end; }
.lab-row { grid-template-columns: 1fr 1fr; }
.lab-row .field:first-child { grid-column: 1 / -1; }
.lab-row .icon-btn { margin-bottom: 14px; justify-self: end; grid-column: 2; }
@media (min-width: 620px) {
  .med-row { grid-template-columns: 1.6fr 1fr 1.2fr auto; }
  .med-row .field:first-child { grid-column: auto; }
  .lab-row { grid-template-columns: 1.6fr .8fr .8fr 1fr auto; }
  .lab-row .field:first-child { grid-column: auto; }
  .lab-row .icon-btn { grid-column: auto; }
}
.rows + .recog, .recog { font-size: 13.5px; color: var(--good); margin: 2px 0 10px; }
.save-state { font-size: 13.5px; color: var(--ink-3); white-space: nowrap; }
.data-actions { display: grid; gap: 6px 22px; }
@media (min-width: 620px) { .data-actions { grid-template-columns: 1fr 1fr; } }
.data-actions .hint { margin-top: 6px; }
.sync-state { padding: 11px 14px; border-radius: 10px; background: var(--info-bg); color: var(--ink-2); font-size: 14.5px; }
.sync-state.s-ok { background: var(--good-bg); color: var(--good); }
.sync-state.s-fehler { background: var(--danger-bg); color: var(--danger); }
.ok-text { color: var(--good); }
.error-text { color: var(--danger); }
.notice { padding: 16px 18px; border-radius: 12px; background: var(--accent-soft); margin-bottom: 8px; }
.notice p { margin-bottom: 12px; }
.about p { max-width: 70ch; }
.privacy { color: var(--ink-3); max-width: 70ch; }

          add({ id: "ul:" + e.key, sev: ul.kind !== "guide" && e.total >= ul.value * 1.5 ? "danger" : "warn", tag: "Amount",
            title: `${n.name}: ${fmt(e.total)} ${e.unit} a day – above the upper limit`,
            text: `${UL_KIND[ul.kind]}: ${fmt(ul.value)} ${e.unit} (${scope}, ${ul.src}). ${ul.note ? ul.note + ". " : ""}Found in: ${names(src)}.`, supps: ids(src) });
        } else if (ul.scope === "total" && ul.kind !== "guide" && e.total >= ul.value * 0.8) {
          add({ id: "ulnear:" + e.key, sev: "info", tag: "Amount", title: `${n.name}: close to the upper limit`,
            text: `${fmt(e.total)} of ${fmt(ul.value)} ${e.unit} already come from supplements – food adds to that.`, supps: ids(src) });
        }
      }
      (n.alerts || []).forEach((a, ix) => {
        if (e.total >= (a.min || 0) && (a.max == null || e.total < a.max)) add({ id: `alert:${e.key}:${ix}`, sev: a.sev, tag: "Note", title: a.title, text: a.text, supps: ids(src) });
      });
      if (src.length >= 2) add({ id: "dup:" + e.key, sev: "info", tag: "Overlap", title: `${n.name} is in ${src.length} supplements`, text: `${names(src)} – together ${fmt(e.total)} ${e.unit} a day.`, supps: ids(src) });
      if (n.perDose) {
        e.sources.forEach(s => {
          if (s.daily == null) return;
          const per = s.daily / Math.max(1, (s.supp.slots || []).length);
          if (per > n.perDose) add({ id: `perdose:${e.key}:${s.supp.id}`, sev: "timing", tag: "Timing", title: `Split ${n.name.toLowerCase()} into several doses`,
            text: `${suppName(s.supp)} provides ${fmt(per)} ${e.unit} per dose. More than ${n.perDose} ${e.unit} at once is absorbed less well.`, supps: [s.supp.id] });
        });
      }
      if (e.unconverted) add({ id: "unit:" + e.key, sev: "info", tag: "Input", title: `${n.name}: check the unit`,
        text: `One amount couldn't be converted to ${e.unit} and is missing from the daily total.`, supps: ids(src) });
    });

    // 2) nutrient interactions
    KB.pairs.forEach(p => {
      if (!has(p.a) || !has(p.b)) return;
      if (p.minA && amount(p.a) < p.minA) return;
      if (p.minB && amount(p.b) < p.minB) return;
      const A = suppsWith(p.a), B = suppsWith(p.b);
      const id = `pair:${p.a}:${p.b}`;
      if (p.kind === "avoid") add({ id, sev: p.sev || "warn", tag: "Interaction", title: p.title, text: p.text, supps: ids(A.concat(B)) });
      else if (p.kind === "synergy") add({ id, sev: "good", tag: "Combination", title: p.title, text: p.text, supps: ids(A.concat(B)) });
      else if (p.kind === "separate") {
        const clash = [];
        A.forEach(a => B.forEach(b => {
          if (a.id === b.id) return;
          const g = minGap(a.slots, b.slots);
          if (g != null && g < p.hours) clash.push([a, b]);
        }));
        if (clash.length) {
          const [a, b] = clash[0];
          add({ id, sev: "timing", tag: "Timing", title: p.title, text: `${p.text} Currently: ${suppName(a)} ${slotList(a.slots)}, ${suppName(b)} ${slotList(b.slots)}.`, supps: ids(clash.flat()) });
        }
      }
    });
    if (has("zinc")) {
      const z = amount("zinc"), cu = amount("copper");
      if (cu === 0 && z >= 25) add({ id: "zinc-copper", sev: "warn", tag: "Interaction", title: "A lot of zinc without copper",
        text: `${fmt(z)} mg zinc a day can cause copper deficiency over time. Lower the dose, limit the duration or add 1–2 mg copper.`, supps: ids(suppsWith("zinc")) });
      else if (cu === 0 && z >= 15) add({ id: "zinc-copper", sev: "info", tag: "Interaction", title: "Zinc over a longer period",
        text: `With ${fmt(z)} mg zinc a day for months, watch your copper intake (nuts, whole grains) or choose a product with some copper.`, supps: ids(suppsWith("zinc")) });
      else if (cu > 0 && z / cu > 20) add({ id: "zinc-copper", sev: "info", tag: "Interaction", title: "Zinc to copper ratio",
        text: `Currently about ${fmt(z / cu)} to 1. About 10–15 to 1 is usually recommended.`, supps: ids(suppsWith("zinc").concat(suppsWith("copper"))) });
    }
    if (amount("folate") >= 800 && !has("vitamin_b12")) add({ id: "folate-b12", sev: "info", tag: "Interaction", title: "A lot of folic acid without B12",
      text: "High folic acid doses can mask a B12 deficiency. Keep an eye on your B12 status.", supps: ids(suppsWith("folate")) });
    if (profile.diet === "Vegan" && !has("vitamin_b12")) add({ id: "vegan-b12", sev: "warn", tag: "Diet", title: "Vegan without vitamin B12",
      text: "On a vegan diet a B12 supplement is necessary – plant foods provide no usable B12." });
    else if (profile.diet === "Vegetarian" && !has("vitamin_b12")) add({ id: "veg-b12", sev: "info", tag: "Diet", title: "Vegetarian: check B12",
      text: "Vegetarians are more often low in B12. A blood test (holo-TC) shows whether you need a supplement." });

    // 3) timing per supplement
    supps.forEach(s => {
      const nuts = suppNutrients(s);
      const slots = s.slots || [];
      if (!slots.length) {
        if ((s.ingredients || []).some(i => String(i.name || "").trim())) add({ id: "noslot:" + s.id, sev: "info", tag: "Timing", title: `${suppName(s)}: no time set`,
          text: "Set when you take it – then spacing and interactions can be checked.", supps: [s.id] });
        return;
      }
      nuts.forEach(n => {
        if (n.fat && slots.includes("fasting")) add({ id: `fat:${s.id}:${n.id}`, sev: "timing", tag: "Timing", title: `${suppName(s)}: better with a meal`,
          text: `${n.name} is fat-soluble and is absorbed much better with a meal that contains fat.`, supps: [s.id] });
        (n.avoid || []).forEach(av => {
          if (slots.includes(av.slot)) add({ id: `avoid:${s.id}:${n.id}:${av.slot}`, sev: av.sev || "timing", tag: "Timing",
            title: `${suppName(s)}: better not ${slotPhrase(av.slot)}`, text: `${n.name} ${av.why}.`, supps: [s.id] });
        });
      });
    });

    // 4) medications
    const meds = matchDrugs(profile.medications);
    KB.drugRules.forEach((r, ix) => {
      const hits = meds.filter(m => [].concat(r.drug).includes(m.cls.id));
      if (!hits.length) return;
      const medNames = uniq(hits.map(h => String(h.med.name).trim())).join(", ");
      if (r.n === "*") {
        if (r.needsSupps && !supps.length) return;
        add({ id: `drug:${ix}`, sev: r.sev, tag: "Medication", title: r.title || medNames, text: `${r.text} (Applies to: ${medNames})` });
        return;
      }
      [].concat(r.n).forEach(nid => {
        if (!has(nid)) return;
        if (r.min && amount(nid) < r.min) return;
        const nut = NUT[nid];
        const ss = suppsWith(nid);
        if (r.sep) {
          let worst = null, unknown = null;
          hits.forEach(h => {
            const medSlot = h.med.slot || r.medSlot;
            ss.forEach(s => {
              const g = medSlot ? minGap([medSlot], s.slots) : null;
              if (g == null) unknown = unknown || { s, h };
              else if (g < r.sep && (!worst || g < worst.g)) worst = { s, g, medSlot, h };
            });
          });
          if (worst) {
            add({ id: `drug:${ix}:${nid}`, sev: "warn", tag: "Medication", title: `${nut.name} too close to ${String(worst.h.med.name).trim()}`,
              text: `${fill(r.text, nut)} Currently: ${String(worst.h.med.name).trim()} ${slotPhrase(worst.medSlot)}${worst.h.med.slot ? "" : " (assumed – change it in your profile)"}, ${suppName(worst.s)} ${slotList(worst.s.slots)}.`,
              supps: [worst.s.id] });
          } else if (unknown) {
            add({ id: `drug:${ix}:${nid}`, sev: "info", tag: "Medication", title: `${nut.name} and ${medNames}: keep apart`,
              text: `${fill(r.text, nut)} Add the time you take it in your profile and for the supplement, then the spacing gets checked.`, supps: [unknown.s.id] });
          }
          return;
        }
        add({ id: `drug:${ix}:${nid}`, sev: r.sev, tag: "Medication", title: `${nut.name} and ${medNames}`, text: fill(r.text, nut), supps: ids(ss) });
      });
    });

    // 5) conditions (including those derived from results)
    const conds = conditionSet(data, labs);
    KB.conditionRules.forEach((r, ix) => {
      const cs = [].concat(r.c).filter(c => conds.has(c));
      if (!cs.length) return;
      const label = cs.map(c => (COND[c] || { label: c }).label).join(", ");
      if (r.n === "*") {
        if (!supps.length) return;
        add({ id: `cond:${ix}`, sev: r.sev, tag: "Condition", title: r.title || label, text: r.text });
        return;
      }
      [].concat(r.n).forEach(nid => {
        if (!has(nid)) return;
        const a = amount(nid);
        if (r.min != null && a < r.min) return;
        if (r.max != null && a >= r.max) return;
        const nut = NUT[nid];
        add({ id: `cond:${ix}:${nid}`, sev: r.sev, tag: "Condition", title: `${nut.name}: ${label}`, text: fill(r.text, nut), supps: ids(suppsWith(nid)) });
      });
    });

    // 6) duration
    const today = startOfDay(opts.today ? new Date(opts.today) : new Date());
    supps.forEach(s => {
      const start = parseDate(s.startDate);
      if (!start || isNaN(start)) return;
      const weeks = Math.floor((today - start) / (7 * 864e5));
      if (weeks < 0) return;
      const dur = parseNum(s.durationWeeks);
      const ended = dur && weeks >= dur;
      if (ended) add({ id: "dur:" + s.id, sev: "info", tag: "Duration", title: `${suppName(s)}: planned duration reached`,
        text: `Taken for ${weeks} weeks – ${fmt(dur)} were planned. Time to review benefit and need, and pause if appropriate.`, supps: [s.id] });
      else if (dur && dur - weeks <= 1) add({ id: "dursoon:" + s.id, sev: "info", tag: "Duration", title: `${suppName(s)}: planned duration ends soon`,
        text: `Week ${weeks + 1} of ${fmt(dur)}. Decide whether to continue or pause – a blood test first may help.`, supps: [s.id] });
      if (!ended) suppNutrients(s).forEach(n => {
        if (n.review && weeks >= n.review.weeks) add({ id: `rev:${s.id}:${n.id}`, sev: "info", tag: "Duration", title: `${suppName(s)}: taken for ${weeks} weeks`, text: n.review.text, supps: [s.id] });
      });
    });

    // 7) results
    labs.forEach(h => {
      const last = h.last;
      if (!last || last.level === "unknown") return;
      const m = h.marker;
      const value = `${last.item.value} ${last.unit}`.trim();
      const date = fmtDate(last.date);
      let matched = false;
      if (m) (m.advice || []).forEach((a, ix) => {
        if (!a.when.includes(last.level)) return;
        if (a.taking && !has(a.taking)) return;
        if (a.notTaking && has(a.notTaking)) return;
        matched = true;
        const started = a.taking ? startOf(a.taking) : null;
        if (started && last.date && last.date < started) {
          add({ id: `labpre:${m.id}`, sev: "info", tag: "Results", title: `${m.name}: last test was before you started`,
            text: `Your last result (${value}, ${date}) predates your ${NUT[a.taking].name} supplement. See “What's due” for when to retest.`, lab: m.id });
          return;
        }
        add({ id: `lab:${m.id}:${ix}`, sev: a.sev, tag: "Results", title: a.title,
          text: a.text.replace(/\{value\}/g, value).replace(/\{date\}/g, date), supps: a.taking ? ids(suppsWith(a.taking)) : [], lab: m.id });
      });
      if (!matched && ["low", "high", "critLow", "critHigh"].includes(last.level)) {
        const crit = last.level.indexOf("crit") === 0;
        add({ id: `labx:${h.key}`, sev: crit ? "danger" : m ? "warn" : "info", tag: "Results", title: `${h.name}: ${LEVEL[last.level].toLowerCase()}`,
          text: `${value} on ${date} is outside the reference range. Discuss it with your doctor.`, lab: h.key });
      }
    });

    const findings = uniqBy(F, f => f.id).sort((a, b) => SEV_ORDER[a.sev] - SEV_ORDER[b.sev]);
    return { findings, totals, meds, labs, conds };
  }

  // ---------- before/after for a new or changed supplement ----------
  function diff(data, draft) {
    const before = analyze(data);
    const sim = Object.assign({}, draft, { status: "active" });
    const after = analyze(data, { supplements: (data.supplements || []).filter(s => s.id !== draft.id).concat([sim]) });
    const beforeIds = new Set(before.findings.map(f => f.id));
    const afterIds = new Set(after.findings.map(f => f.id));
    const added = after.findings.filter(f => !beforeIds.has(f.id));
    const resolved = before.findings.filter(f => !afterIds.has(f.id) && (f.sev === "danger" || f.sev === "warn" || f.sev === "timing"));
    const keys = new Set();
    (draft.ingredients || []).forEach(i => { if (!String(i.name || "").trim()) return; const n = matchNutrient(i.name); keys.add(n ? n.id : "x:" + norm(i.name)); });
    const changes = [];
    keys.forEach(k => {
      const e = after.totals.get(k);
      if (!e) return;
      const b = before.totals.get(k);
      changes.push({ entry: e, before: b ? b.total : 0, ul: effectiveUL(e) });
    });
    return { added, resolved, changes, after };
  }

  // ---------- suggested time of day ----------
  function suggestSlots(draft, data) {
    const nuts = suppNutrients(draft);
    if (!nuts.length) return null;
    const others = (data.supplements || []).filter(s => s.id !== draft.id && isActive(s));
    const score = {}; KB.slots.forEach(s => { score[s.id] = 0; });
    nuts.forEach(n => {
      (n.slots || []).forEach((sl, i) => { score[sl] += 3 - Math.min(i, 2); });
      (n.avoid || []).forEach(a => { score[a.slot] -= 6; });
      if (n.fat) score.fasting -= 6;
    });
    const mine = new Set(nuts.map(n => n.id));
    KB.pairs.filter(p => p.kind === "separate").forEach(p => {
      [[p.a, p.b], [p.b, p.a]].forEach(([m, t]) => {
        if (!mine.has(m)) return;
        others.forEach(o => {
          if (!suppNutrients(o).some(n => n.id === t)) return;
          (o.slots || []).forEach(os => { KB.slots.forEach(sl => { if (Math.abs(SLOT_HOURS[sl.id] - SLOT_HOURS[os]) < p.hours) score[sl.id] -= 4; }); });
        });
      });
    });
    const meds = matchDrugs((data.profile || {}).medications);
    KB.drugRules.filter(r => r.sep).forEach(r => {
      const hit = meds.filter(m => [].concat(r.drug).includes(m.cls.id));
      if (!hit.length || ![].concat(r.n).some(n => mine.has(n))) return;
      hit.forEach(h => {
        const ms = h.med.slot || r.medSlot;
        if (ms) KB.slots.forEach(sl => { if (Math.abs(SLOT_HOURS[sl.id] - SLOT_HOURS[ms]) < r.sep) score[sl.id] -= 5; });
      });
    });
    const k = Math.max(1, Math.min(3, Math.round(servings(draft))));
    const ranked = KB.slots.map(s => ({ slot: s.id, score: score[s.id] })).sort((a, b) => b.score - a.score || SLOT_HOURS[a.slot] - SLOT_HOURS[b.slot]);
    const pick = ranked.filter(r => r.score > 0).slice(0, k).map(r => r.slot);
    if (!pick.length) pick.push(ranked[0].slot);
    return pick.sort((a, b) => SLOT_HOURS[a] - SLOT_HOURS[b]);
  }

  // ---------- what's due: follow-ups, monitoring, screenings ----------
  const STATUS_ORDER = { urgent: 0, overdue: 1, due: 2, soon: 3, planned: 4 };
  function schedule(data, opts) {
    opts = opts || {};
    const today = startOfDay(opts.today ? new Date(opts.today) : new Date());
    const p = data.profile || {};
    const sex = sexKey(p);
    const by = parseNum(p.birthYear);
    const age = by ? today.getFullYear() - by : null;
    const labs = labHistory(data);
    const conds = conditionSet(data, labs);
    const meds = matchDrugs(p.medications);
    const totals = intake((data.supplements || []).filter(isActive));
    const exams = (data.exams || []);
    const items = [];
    const lastMarker = list => { let d = null; (list || []).forEach(id => { const h = labs.get(id); if (h && h.last && h.last.date && (!d || h.last.date > d)) d = h.last.date; }); return d; };
    const lastExam = types => exams.filter(e => e.date && types.includes(e.type)).sort((a, b) => (a.date < b.date ? 1 : -1))[0] || null;

    labs.forEach(h => {
      const l = h.last;
      if (!l || !l.date || !["low", "high", "critLow", "critHigh"].includes(l.level)) return;
      const crit = l.level.indexOf("crit") === 0;
      const weeks = (h.marker && h.marker.retestWeeks) || 12;
      items.push({ id: "fu:" + h.key, cat: "Follow-up", title: h.name, markers: [h.key], urgent: crit, last: l.date,
        why: `Last result ${l.item.value} ${l.unit} (${fmtDate(l.date)}) was ${LEVEL[l.level].toLowerCase()}.` + (crit ? " Talk to your doctor soon." : " Recheck to see whether it has changed."),
        due: crit ? today : addDays(parseDate(l.date), weeks * 7) });
    });

    KB.monitoring.forEach((r, ix) => {
      let since = null, reason = "";
      if (r.nutrient) {
        const e = totals.get(r.nutrient);
        if (!e || !e.sources.length || (r.min && e.total < r.min)) return;
        since = e.sources.map(s => s.supp.startDate).filter(Boolean).sort()[0] || null;
        reason = `You take ${NUT[r.nutrient].name} (${uniq(e.sources.map(s => suppName(s.supp))).join(", ")}).`;
      } else if (r.cond) {
        const cs = [].concat(r.cond).filter(c => conds.has(c));
        if (!cs.length) return;
        reason = `${COND[cs[0]].label}.`;
      } else if (r.drug) {
        const hit = meds.filter(m => [].concat(r.drug).includes(m.cls.id));
        if (!hit.length) return;
        reason = `You take ${uniq(hit.map(h => String(h.med.name).trim())).join(", ")}.`;
      } else if (r.diet) {
        if (p.diet !== r.diet) return;
        reason = `${r.diet} diet.`;
      }
      const last = lastMarker(r.markers);
      let due;
      if (r.firstWeeks && since && (!last || last < since)) due = addDays(parseDate(since), r.firstWeeks * 7);
      else if (last) due = addMonths(parseDate(last), r.months);
      else due = today;
      items.push({ id: "mon:" + ix, cat: "Monitoring", title: r.title, markers: r.markers, why: reason + " " + r.text, due, last });
    });

    let missingAge = false, missingSex = false;
    const covered = new Set();
    KB.screenings.forEach(s => {
      if (s.minAge != null || s.maxAge != null) {
        if (age == null) { missingAge = true; return; }
        if (s.minAge != null && age < s.minAge) return;
        if (s.maxAge != null && age > s.maxAge) return;
      }
      if (s.sex) { if (!sex) { missingSex = true; return; } if (s.sex !== sex) return; }
      (s.exams || []).forEach(t => covered.add(t));
      const risky = (s.risk && s.risk.some(c => conds.has(c))) || (s.riskAge && age >= s.riskAge);
      const months = risky && s.riskMonths ? s.riskMonths : s.months;
      const ex = s.exams ? lastExam(s.exams) : null;
      const mk = s.markers ? lastMarker(s.markers) : null;
      let last = null, interval = months, nextDue = null;
      if (ex) { last = ex.date; if (s.examMonths && s.examMonths[ex.type]) interval = s.examMonths[ex.type]; if (ex.nextDue) nextDue = ex.nextDue; }
      if (mk && (!last || mk > last)) { last = mk; interval = months; nextDue = null; }
      let due;
      if (nextDue) due = parseDate(nextDue);
      else if (s.once) { if (last) return; due = today; }
      else due = last ? addMonths(parseDate(last), interval) : today;
      items.push({ id: "scr:" + s.id, cat: "Screening", title: s.title, markers: s.markers || [], why: s.text, due, last });
    });

    const latest = {};
    exams.forEach(e => {
      const t = e.type === "Other" ? (e.customType || "Other") : e.type;
      if (!latest[t] || (e.date || "") > (latest[t].date || "")) latest[t] = e;
    });
    Object.keys(latest).forEach(t => {
      const e = latest[t];
      if (!e.nextDue || covered.has(e.type)) return;
      items.push({ id: "exam:" + t, cat: "Your doctor", title: t, why: "Date recommended at your last appointment.", due: parseDate(e.nextDue), last: e.date || null });
    });

    const merged = [];
    items.forEach(it => {
      const twin = (it.markers || []).length ? merged.find(o => (o.markers || []).some(k => it.markers.includes(k))) : null;
      if (twin) {
        if (it.due < twin.due) twin.due = it.due;
        twin.urgent = twin.urgent || it.urgent;
        if (!twin.why.includes(it.why)) twin.why += " " + it.why;
        if (it.last && (!twin.last || it.last > twin.last)) twin.last = it.last;
        return;
      }
      merged.push(Object.assign({}, it));
    });
    merged.forEach(it => {
      it.days = Math.round((it.due - today) / 864e5);
      it.status = it.urgent ? "urgent" : it.days < 0 && it.last ? "overdue" : it.days <= 0 ? "due" : it.days <= 60 ? "soon" : "planned";
    });
    merged.sort((a, b) => STATUS_ORDER[a.status] - STATUS_ORDER[b.status] || a.days - b.days);
    return { items: merged, missingAge, missingSex, age };
  }

  window.Engine = {
    analyze, diff, suggestSlots, schedule, labHistory, evaluate, matchNutrient, matchMarker, matchDrugs, intake, effectiveUL,
    toBase, normUnit, refFor, targetFor, toCanon, fromCanon, sameUnit, preferredUnit, markerUnits, unitKnown, labUnitKey,
    util: { norm, parseNum, fmt, fmtDate, parseDate, suppName, isActive, slotPhrase, slotList, servings, suppNutrients, cap, sexKey },
    SEV_ORDER, SLOT_HOURS, UL_KIND, LEVEL, NUT, MK, COND
  };
})();

</script>
<script>
/* =====================================================================
   STORAGE – data stays in this browser
   ===================================================================== */
(function () {
  const mem = {};
  const LS = {
    get(k) { try { return window.localStorage.getItem(k); } catch (e) { return k in mem ? mem[k] : null; } },
    set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { mem[k] = v; } },
    del(k) { try { window.localStorage.removeItem(k); } catch (e) { delete mem[k]; } }
  };
  const KEYS = { data: "dose.data.v1", settings: "dose.settings.v1", sync: "dose.sync.v1" };
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function emptyProfile() {
    return { birthYear: "", sex: "", heightCm: "", weightKg: "", conditions: [], conditionsText: "", medications: [], allergies: "",
      diet: "", dietNotes: "", activity: "", sport: "", sleepHours: "", stress: "", smoking: "", alcohol: "", goals: [], goalsText: "", labUnits: "si" };
  }
  function emptyData() { return { version: 2, meta: { updatedAt: null }, profile: emptyProfile(), supplements: [], labs: [], exams: [], reports: [] }; }
  function normalize(d) {
    const out = emptyData();
    if (!d || typeof d !== "object") return out;
    out.meta = Object.assign({ updatedAt: null }, d.meta || {});
    out.profile = Object.assign(emptyProfile(), d.profile || {});
    ["conditions", "medications", "goals"].forEach(k => { if (!Array.isArray(out.profile[k])) out.profile[k] = []; });
    out.profile.medications.forEach(m => { if (!m.id) m.id = uid(); });
    out.supplements = Array.isArray(d.supplements) ? d.supplements : [];
    out.supplements.forEach(s => {
      if (!s.id) s.id = uid();
      if (!Array.isArray(s.ingredients)) s.ingredients = [];
      if (!Array.isArray(s.slots)) s.slots = [];
      if (!s.status) s.status = "active";
    });
    out.labs = Array.isArray(d.labs) ? d.labs : [];
    out.labs.forEach(p => { if (!p.id) p.id = uid(); if (!Array.isArray(p.items)) p.items = []; p.items.forEach(i => { if (!i.id) i.id = uid(); }); });
    // older versions kept lab values in the profile
    const old = d.profile && Array.isArray(d.profile.labs) ? d.profile.labs : [];
    if (old.length) {
      const byDate = {};
      old.forEach(l => { const k = l.date || ""; (byDate[k] = byDate[k] || []).push({ id: uid(), name: l.name || "", value: l.value || "", unit: l.unit || "", refLow: "", refHigh: "" }); });
      Object.keys(byDate).forEach(k => out.labs.push({ id: uid(), date: k, source: "", notes: "", items: byDate[k] }));
    }
    delete out.profile.labs;
    out.exams = Array.isArray(d.exams) ? d.exams : [];
    out.exams.forEach(e => { if (!e.id) e.id = uid(); });
    out.reports = Array.isArray(d.reports) ? d.reports : [];
    return out;
  }
  const listeners = [];
  const defaultsGh = { owner: "", repo: "dose-data", token: "", pass: "", path: "dose-data.json" };
  const Store = {
    data: null, settings: null, uid, emptyData, normalize,
    load() {
      let d = null, s = null;
      try { d = JSON.parse(LS.get(KEYS.data) || "null"); } catch (e) { d = null; }
      try { s = JSON.parse(LS.get(KEYS.settings) || "null"); } catch (e) { s = null; }
      this.data = normalize(d);
      this.settings = Object.assign({ apiKey: "", model: "claude-sonnet-5-5", customModel: "" }, s || {});
      this.settings.gh = Object.assign({}, defaultsGh, (s && s.gh) || {});
      return this;
    },
    save(opts) {
      const touch = !opts || opts.touch !== false;
      if (touch) this.data.meta.updatedAt = new Date().toISOString();
      LS.set(KEYS.data, JSON.stringify(this.data));
      listeners.forEach(fn => { try { fn({ touch }); } catch (e) { console.error(e); } });
    },
    replace(d, opts) { this.data = normalize(d); this.save({ touch: !!(opts && opts.touch) }); },
    saveSettings() { LS.set(KEYS.settings, JSON.stringify(this.settings)); },
    getSync() { try { return JSON.parse(LS.get(KEYS.sync) || "{}") || {}; } catch (e) { return {}; } },
    setSync(v) { LS.set(KEYS.sync, JSON.stringify(v || {})); },
    resetSync() { LS.del(KEYS.sync); },
    onChange(fn) { listeners.push(fn); },
    wipe() { LS.del(KEYS.data); LS.del(KEYS.sync); this.data = emptyData(); LS.set(KEYS.data, JSON.stringify(this.data)); }
  };
  window.Store = Store;
})();

<script>
/* =====================================================================
   SYNC – encrypted via a private GitHub repository
   Data is encrypted in the browser with AES-GCM (key derived from
   your password with PBKDF2). GitHub only ever sees ciphertext.
   ===================================================================== */
(function () {
  const enc = new TextEncoder(), dec = new TextDecoder();
  const ITER = 310000;
  const FORMAT = "dose-encrypted";

  const b64 = {
    from(buf) {
      const b = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
      let s = "";
      for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
      return btoa(s);
    },
    to(str) {
      const s = atob(str);
      const b = new Uint8Array(s.length);
      for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
      return b;
    }
  };

  class SyncError extends Error { constructor(code, msg) { super(msg); this.code = code; } }

  const keyCache = new Map();
  async function deriveKey(pass, saltB64, iter) {
    const id = saltB64 + "|" + iter + "|" + pass;
    if (keyCache.has(id)) return keyCache.get(id);
    const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64.to(saltB64), iterations: iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    keyCache.set(id, key);
    return key;
  }
  async function encrypt(obj, pass, saltB64) {
    const salt = saltB64 || b64.from(crypto.getRandomValues(new Uint8Array(16)));
    const key = await deriveKey(pass, salt, ITER);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(JSON.stringify(obj)));
    return { format: FORMAT, v: 1, kdf: "PBKDF2-SHA256", iter: ITER, salt, iv: b64.from(iv), data: b64.from(ct) };
  }
  async function decrypt(env, pass) {
    if (!env || env.format !== FORMAT) throw new SyncError("format", "The file in the data repository wasn't created by this app. Check the repository name.");
    const key = await deriveKey(pass, env.salt, env.iter || ITER);
    try {
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64.to(env.iv) }, key, b64.to(env.data));
      return JSON.parse(dec.decode(pt));
    } catch (e) {
      throw new SyncError("passwort", "The encryption password doesn't match the stored data. Use the same password on all devices.");
    }
  }

  // ---------- GitHub ----------
  function cfg() { return Store.settings.gh; }
  function configured() { const g = cfg(); return !!(g.owner.trim() && g.repo.trim() && g.token.trim() && g.pass); }
  function repoPath() { return "/repos/" + encodeURIComponent(cfg().owner.trim()) + "/" + encodeURIComponent(cfg().repo.trim()); }
  function filePath() { return repoPath() + "/contents/" + encodeURIComponent(cfg().path || "dose-data.json"); }

  async function api(path, opts) {
    opts = opts || {};
    const headers = Object.assign({
      "Accept": "application/vnd.github+json",
      "Authorization": "Bearer " + cfg().token.trim(),
      "X-GitHub-Api-Version": "2022-11-28"
    }, opts.headers || {});
    try {
      return await fetch("https://api.github.com" + path, Object.assign({ cache: "no-store" }, opts, { headers }));
    } catch (e) {
      throw new SyncError("netz", "Can't reach GitHub. Check your internet connection.");
    }
  }
  async function ghError(res) {
    let msg = "";
    try { msg = (await res.json()).message || ""; } catch (e) { /* leer */ }
    const g = cfg();
    if (res.status === 401) return new SyncError("token", "GitHub rejected the access token – it has expired or was copied incorrectly. Create a new token and enter it.");
    if (res.status === 403) return new SyncError("rechte", "The token can't write to this repository. Under Repository permissions, set Contents to Read and write." + (msg ? " (" + msg + ")" : ""));
    if (res.status === 404) return new SyncError("repo", "Repository " + g.owner.trim() + "/" + g.repo.trim() + " not found. Check the username, repository name and whether the token has access to it.");
    return new SyncError("http", "GitHub returned error " + res.status + (msg ? ": " + msg : "") + ".");
  }
  async function checkRepo() {
    const res = await api(repoPath());
    if (!res.ok) throw await ghError(res);
    const j = await res.json();
    if (!j.private) throw new SyncError("oeffentlich", "The data repository is public. Make it private (Settings → General → Danger Zone → Change visibility), then connect again.");
    return j;
  }
  async function pull() {
    const res = await api(filePath());
    if (res.status === 404) { await checkRepo(); return null; }
    if (!res.ok) throw await ghError(res);
    const j = await res.json();
    let text;
    if (j.content) text = dec.decode(b64.to(j.content.replace(/\s/g, "")));
    else {
      const raw = await api(filePath(), { headers: { Accept: "application/vnd.github.raw+json" } });
      if (!raw.ok) throw await ghError(raw);
      text = await raw.text();
    }
    let env;
    try { env = JSON.parse(text); } catch (e) { throw new SyncError("format", "The file in the data repository is damaged."); }
    return { sha: j.sha, env };
  }
  async function push(env, sha) {
    const body = { message: "Dose: data updated", content: b64.from(enc.encode(JSON.stringify(env))) };
    if (sha) body.sha = sha;
    const res = await api(filePath(), { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (res.status === 409 || res.status === 422) throw new SyncError("konflikt", "The data was changed on another device at the same time.");
    if (!res.ok) throw await ghError(res);
    const j = await res.json();
    return j.content.sha;
  }

  // ---------- flow ----------
  let running = false, again = false, timer = null, lastRun = 0;
  let status = { state: "aus", text: "" };
  const statusListeners = [];
  function setStatus(state, text) {
    status = { state, text: text || "", time: new Date() };
    statusListeners.forEach(fn => { try { fn(status); } catch (e) { console.error(e); } });
  }

  function adopt(rdata, sha, st) {
    Store.replace(rdata, { touch: false });
    Store.setSync(Object.assign(st, { sha, lastSyncedAt: Store.data.meta.updatedAt, lastTime: Date.now() }));
    if (Sync.onAdopt) Sync.onAdopt();
  }
  async function upload(sha, st, attempt) {
    const snap = JSON.parse(JSON.stringify(Store.data));
    const env = await encrypt(snap, cfg().pass, st.salt);
    try {
      const newSha = await push(env, sha);
      Store.setSync(Object.assign(st, { sha: newSha, salt: env.salt, lastSyncedAt: snap.meta.updatedAt, lastTime: Date.now() }));
    } catch (e) {
      if (e.code === "konflikt" && attempt < 2) return doSync(attempt + 1);
      throw e;
    }
  }
  async function doSync(attempt) {
    const st = Store.getSync();
    const remote = await pull();
    const lU = Store.data.meta.updatedAt || null;
    const base = st.lastSyncedAt || null;
    if (!remote) {
      if (lU) await upload(null, st, attempt);
      return;
    }
    const rdata = await decrypt(remote.env, cfg().pass);
    st.salt = remote.env.salt;
    const rU = (rdata.meta && rdata.meta.updatedAt) || null;
    if (lU && lU === rU) { Store.setSync(Object.assign(st, { sha: remote.sha, lastSyncedAt: lU, lastTime: Date.now() })); return; }
    const localChanged = !!lU && lU !== base;
    const remoteChanged = rU !== base;
    if (remoteChanged && !localChanged) { adopt(rdata, remote.sha, st); return; }
    if (localChanged && !remoteChanged) { await upload(remote.sha, st, attempt); return; }
    if (!localChanged && !remoteChanged) { Store.setSync(Object.assign(st, { sha: remote.sha, lastTime: Date.now() })); return; }
    const choice = Sync.onConflict ? await Sync.onConflict({ local: lU, remote: rU }) : "remote";
    if (choice === "local") await upload(remote.sha, st, attempt);
    else adopt(rdata, remote.sha, st);
  }

  async function run() {
    if (!configured()) { setStatus("aus"); return; }
    if (typeof navigator !== "undefined" && navigator.onLine === false) { setStatus("offline", "Offline – changes will sync later."); return; }
    if (running) { again = true; return; }
    running = true; lastRun = Date.now();
    setStatus("laeuft", "Syncing …");
    try {
      await doSync(0);
      setStatus("ok", "");
    } catch (e) {
      console.error(e);
      setStatus("fehler", e.message || String(e));
    } finally {
      running = false;
      if (again) { again = false; setTimeout(run, 400); }
    }
  }
  function schedule(ms) {
    if (!configured()) return;
    clearTimeout(timer);
    timer = setTimeout(() => { timer = null; run(); }, ms == null ? 2500 : ms);
  }

  const Sync = {
    run, schedule, configured, checkRepo, encrypt, decrypt,
    get status() { return status; },
    onStatus(fn) { statusListeners.push(fn); },
    onConflict: null,
    onAdopt: null,
    init() {
      Store.onChange(({ touch }) => { if (touch) schedule(); });
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && Date.now() - lastRun > 15000) run();
        if (document.visibilityState === "hidden" && timer) { clearTimeout(timer); timer = null; run(); }
      });
      window.addEventListener("online", () => run());
      if (configured()) run(); else setStatus("aus");
    }
  };
  window.Sync = Sync;
})();

<script>
/* =====================================================================
   MARKDOWN – kleine, sichere Darstellung der KI-Antworten
   ===================================================================== */
(function () {
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/__([^_]+)__/g, "<strong>$1</strong>")
      .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<em>$2</em>")
      .replace(/(^|[^\w])_([^_\s][^_]*?)_(?=[^\w]|$)/g, "$1<em>$2</em>");
  }
  const LIST_RE = /^(\s*)([-*•+]|\d+[.)])\s+(.*)$/;

  function render(src) {
    const lines = String(src || "").replace(/\r/g, "").split("\n");
    const out = [];
    let i = 0;

    function list() {
      const items = [];
      while (i < lines.length) {
        const l = lines[i];
        const m = LIST_RE.exec(l);
        if (m) { items.push({ lvl: m[1].replace(/\t/g, "  ").length >= 2 ? 1 : 0, ord: /\d/.test(m[2]), text: m[3] }); i++; continue; }
        if (l.trim() && /^\s{2,}\S/.test(l) && items.length) { items[items.length - 1].text += " " + l.trim(); i++; continue; }
        break;
      }
      let html = "";
      const stack = [];
      items.forEach(it => {
        while (stack.length > it.lvl + 1) html += "</li></" + stack.pop() + ">";
        if (stack.length === it.lvl + 1) html += "</li>";
        else while (stack.length < it.lvl + 1) { const tag = it.ord ? "ol" : "ul"; html += "<" + tag + ">"; stack.push(tag); }
        html += "<li>" + inline(it.text);
      });
      while (stack.length) html += "</li></" + stack.pop() + ">";
      return html;
    }
    function table(rows) {
      const cells = r => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
      const head = cells(rows[0]);
      let body = rows.slice(1);
      if (body.length && /^[\s|:-]+$/.test(body[0])) body = body.slice(1);
      return '<div class="tablewrap"><table><thead><tr>' + head.map(c => "<th>" + inline(c) + "</th>").join("") +
        "</tr></thead><tbody>" + body.map(r => "<tr>" + cells(r).map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") +
        "</tbody></table></div>";
    }

    while (i < lines.length) {
      const l = lines[i];
      if (!l.trim()) { i++; continue; }
      let m;
      if ((m = /^(#{1,6})\s+(.*)$/.exec(l))) {
        const lvl = Math.min(m[1].length + 1, 4);
        out.push(`<h${lvl}>${inline(m[2].replace(/#+\s*$/, ""))}</h${lvl}>`); i++; continue;
      }
      if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
      if (/^\s*\|/.test(l)) {
        const rows = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(lines[i]); i++; }
        out.push(table(rows)); continue;
      }
      if (LIST_RE.test(l)) { out.push(list()); continue; }
      if (/^>\s?/.test(l)) {
        const q = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) { q.push(lines[i].replace(/^>\s?/, "")); i++; }
        out.push("<blockquote>" + q.map(inline).join("<br>") + "</blockquote>"); continue;
      }
      const para = [];
      while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !LIST_RE.test(lines[i]) && !/^\s*\|/.test(lines[i]) && !/^>/.test(lines[i])) {
        para.push(lines[i].trim()); i++;
      }
      out.push("<p>" + para.map(inline).join("<br>") + "</p>");
    }
    return out.join("\n");
  }
  window.Markdown = { render };
})();
