<script>
/* =====================================================================
   AI ADVISOR – requests to the Claude API with your own key
   ===================================================================== */
(function () {
  const U = Engine.util;
  const MODELS = [
    { id: "claude-sonnet-5-5", label: "Claude Sonnet 5.5 – balanced (recommended)" },
    { id: "claude-opus-5-5", label: "Claude Opus 5.5 – most thorough, more expensive" },
    { id: "claude-haiku-4-5-20251001", label: "Claude Haiku 4.5 – fast and low-cost" },
    { id: "custom", label: "Enter another model ID" }
  ];
  function model() { const s = Store.settings; return s.model === "custom" ? (s.customModel || "").trim() : (s.model || MODELS[0].id); }
  function hasKey() { return !!(Store.settings.apiKey || "").trim(); }

  async function call({ system, messages, maxTokens }) {
    const key = (Store.settings.apiKey || "").trim();
    if (!key) throw new Error("No API key yet. Add it under Settings.");
    if (!model()) throw new Error("No model selected. Choose one under Settings.");
    let res;
    try {
      res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
        body: JSON.stringify({ model: model(), max_tokens: maxTokens || 4096, system, messages })
      });
    } catch (e) { throw new Error("Can't reach the AI. Check your internet connection."); }
    let j = null;
    try { j = await res.json(); } catch (e) { j = null; }
    if (!res.ok) {
      const m = (j && j.error && j.error.message) || "";
      if (res.status === 401) throw new Error("The API key was rejected. Check it under Settings.");
      if (/credit balance/i.test(m)) throw new Error("Your Anthropic credit is used up. Top it up in the Claude Console.");
      if (res.status === 404 || /model/i.test(m)) throw new Error("The selected model isn't available" + (m ? " (" + m + ")" : "") + ". Choose another one under Settings.");
      if (res.status === 429) throw new Error("Too many requests in a short time. Wait a moment and try again.");
      if (res.status === 529 || res.status >= 500) throw new Error("The AI is overloaded right now. Try again in a few minutes.");
      throw new Error("Request failed (" + res.status + ")" + (m ? ": " + m : "") + ".");
    }
    const text = ((j && j.content) || []).filter(b => b.type === "text").map(b => b.text).join("\n").trim();
    if (j && j.stop_reason === "max_tokens") return text + "\n\n_The answer was cut off because of its length._";
    return text;
  }

  // ---------- context ----------
  function suppLine(s, withIng) {
    const brand = (s.brand || "").trim();
    const parts = [(brand ? brand + " – " : "") + U.suppName(s), ((s.serving || "").trim() || "1 serving") + " × " + U.fmt(U.servings(s)) + " per day", "taken " + U.slotList(s.slots)];
    if (s.startDate) { const w = Math.floor((Date.now() - U.parseDate(s.startDate)) / (7 * 864e5)); parts.push("since " + s.startDate + (w >= 0 ? " (" + w + " weeks)" : "")); }
    const d = U.parseNum(s.durationWeeks);
    parts.push(d ? "planned for " + U.fmt(d) + " weeks" : "no planned end");
    if ((s.purpose || "").trim()) parts.push("purpose: " + s.purpose.trim());
    let line = "- " + parts.join("; ");
    if (withIng) {
      const ing = (s.ingredients || []).filter(i => String(i.name || "").trim()).map(i =>
        `${i.name.trim()}${(i.form || "").trim() ? " (" + i.form.trim() + ")" : ""} ${i.amount !== "" && i.amount != null ? i.amount + " " + (i.unit || "") : "amount unknown"}`);
      line += "\n  Per serving: " + (ing.length ? ing.join(", ") : "nothing entered");
      if ((s.notes || "").trim()) line += "\n  Note: " + s.notes.trim();
    }
    return line;
  }
  function profileBlock(p) {
    const L = [];
    const age = U.parseNum(p.birthYear) ? (new Date().getFullYear() - U.parseNum(p.birthYear)) + " years" : "";
    const basics = [age, p.sex, p.heightCm ? p.heightCm + " cm" : "", p.weightKg ? p.weightKg + " kg" : ""].filter(Boolean).join(", ");
    if (basics) L.push("- Person: " + basics);
    const conds = (p.conditions || []).map(c => (Engine.COND[c] || { label: c }).label);
    if ((p.conditionsText || "").trim()) conds.push(p.conditionsText.trim());
    L.push("- Conditions: " + (conds.length ? conds.join("; ") : "none entered"));
    const meds = (p.medications || []).filter(m => String(m.name || "").trim()).map(m => m.name.trim() + (m.dose ? " " + m.dose : "") + (m.slot ? " (" + U.slotPhrase(m.slot) + ")" : ""));
    L.push("- Medication: " + (meds.length ? meds.join("; ") : "none entered"));
    if ((p.allergies || "").trim()) L.push("- Allergies/intolerances: " + p.allergies.trim());
    if (p.diet || p.dietNotes) L.push("- Diet: " + [p.diet, p.dietNotes].filter(Boolean).join(" – "));
    if (p.activity || p.sport) L.push("- Activity: " + [p.activity, p.sport].filter(Boolean).join(" – "));
    if (p.sleepHours) L.push("- Sleep: about " + p.sleepHours + " hours");
    if (p.stress) L.push("- Stress (1–5): " + p.stress);
    if (p.smoking) L.push("- Smoking: " + p.smoking);
    if (p.alcohol) L.push("- Alcohol: " + p.alcohol);
    const goals = (p.goals || []).slice();
    if ((p.goalsText || "").trim()) goals.push(p.goalsText.trim());
    L.push("- Goals: " + (goals.length ? goals.join("; ") : "none entered"));
    return L.join("\n");
  }
  function resultsBlock(data) {
    const hist = Engine.labHistory(data);
    const sex = U.sexKey(data.profile);
    const lines = [];
    hist.forEach(h => {
      const ref = h.marker ? Engine.refFor(h.marker, sex) : null;
      const ents = h.entries.slice(-4).map(e => {
        const r = (e.item.refLow || e.item.refHigh) ? ` [lab range ${e.item.refLow || "–"}–${e.item.refHigh || "–"}]` : "";
        return `${e.date || "no date"}: ${e.item.value} ${e.unit}${r} (${Engine.LEVEL[e.level]})`;
      });
      lines.push(`- ${h.name}${h.marker ? " (app reference " + (ref ? (ref[0] ?? "–") + "–" + (ref[1] ?? "–") : "–") + " " + h.marker.unit + ")" : ""}: ${ents.join("; ")}`);
    });
    const exams = (data.exams || []).slice().sort((a, b) => ((a.date || "") < (b.date || "") ? 1 : -1)).map(e =>
      `- ${e.date || "no date"}: ${e.type === "Other" ? (e.customType || "Other") : e.type} – ${e.result || "no result"}${e.summary ? ": " + e.summary : ""}${e.nextDue ? " (next recommended: " + e.nextDue + ")" : ""}`);
    const sched = Engine.schedule(data).items.map(i => `- ${i.title}: ${i.status}, due ${i.due.toISOString().slice(0, 10)} – ${i.why}`);
    return [
      "## Lab results and measurements", lines.length ? lines.join("\n") : "- none entered",
      "## Examinations", exams.length ? exams.join("\n") : "- none entered",
      "## Check-up schedule computed by the app", sched.length ? sched.join("\n") : "- nothing due"
    ].join("\n\n");
  }
  function buildContext(data) {
    const active = data.supplements.filter(U.isActive);
    const inactive = data.supplements.filter(s => !U.isActive(s));
    const { findings, totals } = Engine.analyze(data);
    const tot = [];
    totals.forEach(e => {
      const ul = Engine.effectiveUL(e);
      tot.push(`- ${e.name}: ${U.fmt(e.total)} ${e.unit}/day${ul ? ` (${Engine.UL_KIND[ul.kind]} ${U.fmt(ul.value)} ${e.unit}, ${ul.scope === "total" ? "incl. food" : "supplements only"})` : ""}`);
    });
    const label = { danger: "See a doctor", warn: "Caution", timing: "Timing", info: "Note", good: "Good" };
    const fnd = findings.map(f => `- [${label[f.sev]}] ${f.title}: ${f.text}`);
    return [
      "Today: " + new Date().toISOString().slice(0, 10),
      "## Profile", profileBlock(data.profile || {}),
      "## Active supplements", active.length ? active.map(s => suppLine(s, true)).join("\n") : "- none",
      inactive.length ? "## Paused or stopped\n" + inactive.map(s => "- " + U.suppName(s) + " (" + s.status + ")").join("\n") : "",
      "## Daily amounts from supplements (computed)", tot.length ? tot.join("\n") : "- none",
      resultsBlock(data),
      "## Automatic rule check by the app", fnd.length ? fnd.join("\n") : "- nothing flagged"
    ].filter(Boolean).join("\n\n");
  }

  const SYSTEM = `You are a careful, evidence-based advisor for nutrition, lifestyle and dietary supplements. You speak directly with the person whose data follows. Always answer in English – clear, friendly and without filler.

Principles:
- Use their conditions, medication, lab results, examinations, diet, activity and goals concretely. Interactions with medication come first.
- Give concrete dose ranges with units, timing and a sensible duration, with a short reason. Don't recommend doses above EFSA upper limits unless you clearly state this needs medical supervision.
- Be honest about the evidence (strong, limited, weak). Say clearly when a supplement probably adds little or is redundant.
- Put lifestyle and diet first when they achieve more than a supplement.
- Lab values may be in SI units (standard in China and Europe) or conventional units. When you mention values, use the units the person's lab used.
- Interpret lab values in context: the lab's own reference range, trends over time, timing relative to starting a supplement, and factors that distort values (inflammation, biotin, creatine, fasting).
- Name the tests that clarify needs or show progress, and when to do them.
- If something should be checked by a doctor, say so clearly and name warning signs. Don't diagnose.
- The app's automatic rule check and schedule are aids: confirm, extend or correct them where needed.
- Format in Markdown with short ## sections and lists. Bold only for key points. As brief as possible while complete.`;

  const ask = (prompt, maxTokens) => call({ system: SYSTEM, messages: [{ role: "user", content: prompt }], maxTokens: maxTokens || 6000 });

  function analyzePlan(data) {
    return ask(`${buildContext(data)}

---
Review my current supplement plan. Structure:
## Summary
## Risks and interactions
## Dosage (per nutrient: right, too high or too low for my goals and results – with a suggestion)
## Daily schedule (a concrete routine)
## Duration and breaks
## Redundant or duplicated
## Possible gaps (only if well justified)
## Tests to check
## Discuss with your doctor or pharmacist`);
  }
  function solveProblem(data, question) {
    return ask(`${buildContext(data)}

---
My concern: """${question}"""

Structure:
## Assessment (possible causes, including what my results suggest; when to see a doctor)
## Lifestyle (concrete, doable steps)
## Supplements (only if sensible: nutrient, form, dose, timing, duration, evidence, fit with my plan and medication)
## Changes to my current plan
## How I'll know it works (including tests and time frame)`);
  }
  function reviewResults(data) {
    return ask(`${buildContext(data)}

---
Review my lab results and examinations and tell me what to do. Structure:
## Summary (2–4 sentences)
## Results that need attention (for each: what it may mean, likely causes in my situation, trend over time)
## What to take, stop or change (supplements with dose, timing, duration – and diet/lifestyle)
## Next tests and check-ups (a table: test – when – why; include follow-ups, supplement monitoring and age-appropriate screenings)
## Discuss with your doctor`, 7000);
  }
  function checkProduct(data, draft, diffResult) {
    const others = Object.assign({}, data, { supplements: data.supplements.filter(s => s.id !== draft.id) });
    const added = diffResult && diffResult.added.length ? diffResult.added.map(f => `- ${f.title}: ${f.text}`).join("\n") : "- nothing new";
    return ask(`${buildContext(others)}

---
I'm thinking about adding (or changing) this supplement:
${suppLine(draft, true)}

The app's rule check reports for it:
${added}

Structure:
## Verdict (fits, fits with changes, or rather not – one sentence with the reason)
## Interactions with my plan and medication
## Dose for my purpose (consider my lab results)
## Timing and spacing
## Duration and when to retest
## Form and product quality
## Watch out`, 4000);
  }

  function parseJson(text, fail) {
    const clean = text.replace(/```json|```/g, "").trim();
    const a = clean.indexOf("{"), b = clean.lastIndexOf("}");
    try { return JSON.parse(clean.slice(a, b + 1)); } catch (e) { throw new Error(fail); }
  }
  function fileBlock(dataUrl) {
    const m = /^data:([a-z]+\/[a-z0-9.+-]+);base64,(.*)$/i.exec(dataUrl);
    if (!m) throw new Error("The file couldn't be read.");
    if (m[1] === "application/pdf") return { type: "document", source: { type: "base64", media_type: "application/pdf", data: m[2] } };
    return { type: "image", source: { type: "base64", media_type: m[1], data: m[2] } };
  }
  async function readLabel(dataUrl) {
    const text = await call({
      system: "You read supplement labels and answer with valid JSON only.",
      messages: [{ role: "user", content: [fileBlock(dataUrl), { type: "text", text: `Read the ingredient / nutrition table of this supplement. The label may be in Chinese or another language.
Answer only with a JSON object, no Markdown, in this schema:
{"brand": string|null, "product": string|null, "form": "Capsule"|"Tablet"|"Powder"|"Drops"|"Liquid"|"Gummy"|"Spray"|"Other"|null, "serving": string|null, "servingsPerDay": number|null, "ingredients": [{"name": string, "form": string|null, "amount": number, "unit": "mg"|"µg"|"g"|"IU"|"bn CFU"}]}
Rules:
- "serving" is the portion the amounts refer to (e.g. "2 capsules"); "servingsPerDay" is the recommended number of those portions per day.
- For minerals, give the elemental amount (e.g. "of which magnesium") as amount and the compound as form (e.g. "bisglycinate").
- Vitamin D preferably in µg. For omega-3, list EPA and DHA as separate entries.
- Use English names (e.g. "Vitamin D3", "Magnesium", "Folic acid", "Vitamin B12").
- Leave out % of reference intake. Leave out anything unreadable – don't guess.` }] }],
      maxTokens: 2000
    });
    return parseJson(text, "The label couldn't be read reliably. Try a sharper photo of the ingredient table.");
  }
  async function readLabReport(dataUrl) {
    const text = await call({
      system: "You extract values from medical lab reports and answer with valid JSON only.",
      messages: [{ role: "user", content: [fileBlock(dataUrl), { type: "text", text: `Extract all measured values from this lab report. It may be in Chinese, German or another language.
Answer only with a JSON object, no Markdown, in this schema:
{"date": "YYYY-MM-DD"|null, "source": string|null, "items": [{"name": string, "value": string, "unit": string|null, "refLow": string|null, "refHigh": string|null}]}
Rules:
- "date" is the sample/collection date; "source" is the lab or practice name.
- Use common English test names (e.g. "Vitamin D (25-OH)", "Ferritin", "Hemoglobin", "TSH", "LDL cholesterol", "HbA1c", "ALT (GPT)", "Creatinine", "eGFR").
- "value" exactly as printed but with a decimal point instead of a comma (keep "<" or ">" if present).
- "unit" in standard Latin notation exactly as the lab used it – do not convert values. Examples: "mmol/L", "µmol/L", "g/L", "pmol/L", "nmol/L", "µg/L", "ng/mL", "mIU/L", "µIU/mL", "U/L", "mg/L", "10^9/L", "10^12/L", "fL", "pg", "%", "mmHg". Write 次/分 as "bpm".
- Dates like 2026年8月3日 or 03.08.2026 become "2026-08-03".
- Split the reference range into refLow and refHigh; use null for an open end (e.g. "< 5" → refLow null, refHigh "5").
- Skip pure text comments. Don't guess unreadable values.` }] }],
      maxTokens: 4000
    });
    return parseJson(text, "The report couldn't be read reliably. Try a sharper photo or the PDF.");
  }
  function test() { return call({ system: "Answer with exactly one word.", messages: [{ role: "user", content: "Say 'Connected'." }], maxTokens: 20 }); }

  window.AI = { MODELS, model, hasKey, analyzePlan, solveProblem, reviewResults, checkProduct, readLabel, readLabReport, test, buildContext };
})();

</script>
<script>
/* =====================================================================
   USER INTERFACE
   ===================================================================== */
(function () {
  const KB = window.KB;
  const U = Engine.util;
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const SEV = { danger: "See a doctor", warn: "Caution", timing: "Timing", info: "Note", good: "Good match" };
  const UL_SHORT = { UL: "Upper limit", safe: "Safe level", guide: "Guide" };
  const STATUS = { urgent: "See doctor soon", overdue: "Overdue", due: "Due now", soon: "Coming up", planned: "Planned" };
  const RESULT = { normal: "No findings", finding: "Findings", followup: "Follow-up needed" };
  const S = { route: "today", sheet: null, busy: null, aiError: null, openReport: null, askDraft: "", saveTimer: null, pvTimer: null,
    introPlayed: false, lastFocus: null, sched: [] };

  const ICON = {
    today: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>',
    supplements: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.8" y="8.6" width="18.4" height="6.8" rx="3.4" transform="rotate(-35 12 12)"/><path d="M9.6 8.6l4.8 6.8"/></svg>',
    results: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5v15h16"/><path d="M7.5 15l3.5-4 3 2.5 5-6.5"/></svg>',
    advisor: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v10.5H10l-4.5 3.8V16H4z"/><path d="M8 9.5h8M8 12.5h5"/></svg>',
    profile: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5c1.2-3.9 4-5.8 7.5-5.8s6.3 1.9 7.5 5.8"/></svg>',
    settings: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>',
    close: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    camera: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3.5l1.5-2.5h6L16.5 8H20v11H4z"/><circle cx="12" cy="13.2" r="3.4"/></svg>',
    plus: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
    calendar: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>'
  };
  const NAV = [["today", "Today"], ["supplements", "Supplements"], ["results", "Results"], ["advisor", "Advisor"], ["profile", "Profile"], ["settings", "Settings"]];

  // ---------- helpers ----------
  function getPath(o, p) { return p.split(".").reduce((x, k) => (x == null ? x : x[k]), o); }
  function setPath(o, p, v) {
    const ks = p.split(".");
    let cur = o;
    for (let i = 0; i < ks.length - 1; i++) { if (cur[ks[i]] == null) cur[ks[i]] = /^\d+$/.test(ks[i + 1]) ? [] : {}; cur = cur[ks[i]]; }
    cur[ks[ks.length - 1]] = v;
  }
  function opt(value, label, sel) { return `<option value="${esc(value)}"${String(sel == null ? "" : sel) === String(value) ? " selected" : ""}>${esc(label)}</option>`; }
  function slotVar(id) { return `var(--s-${id || "none"})`; }
  function slotLabel(id) { const s = KB.slots.find(x => x.id === id); return s ? s.label : id; }
  function sevChip(sev) { return `<span class="sev sev-${sev}">${SEV[sev]}</span>`; }
  function lvChip(level) { return level && level !== "unknown" && level !== "tracked" ? `<span class="lv lv-${level}">${Engine.LEVEL[level]}</span>` : ""; }
  function todayLocal() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
  function shorten(t, n) { t = String(t).replace(/\s+/g, " ").trim(); return t.length > n ? t.slice(0, n - 1) + "…" : t; }
  function fmtDateTime(iso) { return iso ? new Date(iso).toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "unknown"; }
  function monthYear(d) { return d.toLocaleDateString("en-GB", { month: "short", year: "numeric" }); }
  function sexKey() { return U.sexKey(Store.data.profile); }
  function emptyIng() { return { name: "", form: "", amount: "", unit: "mg" }; }
  function emptyLabItem() { return { id: Store.uid(), name: "", value: "", unit: "", refLow: "", refHigh: "" }; }
  function ingSummary(s, max) {
    const list = (s.ingredients || []).filter(i => String(i.name || "").trim());
    const parts = list.slice(0, max).map(i => i.name.trim() + (i.amount !== "" && i.amount != null ? " " + i.amount + " " + (i.unit || "") : ""));
    if (list.length > max) parts.push("+" + (list.length - max) + " more");
    return parts.join(", ");
  }
  function doseText(s, perSlot) {
    const k = U.servings(s);
    const n = perSlot ? k / Math.max(1, (s.slots || []).length) : k;
    const serving = (s.serving || "").trim() || "1 serving";
    return n === 1 ? serving : `${U.fmt(n)} × ${serving}`;
  }
  function examName(e) { return e.type === "Other" ? (e.customType || "Other") : e.type; }

  // ---------- toast & dialog ----------
  function toast(msg, kind) {
    const t = $("#toast");
    t.textContent = msg;
    t.className = "toast show" + (kind ? " " + kind : "");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { t.className = "toast"; }, kind === "error" ? 4500 : 2600);
  }
  function modal({ title, html, actions, dismissable }) {
    return new Promise(resolve => {
      const root = $("#modal-root");
      const prev = document.activeElement;
      root.innerHTML = `<div class="backdrop modal-backdrop"><div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="m-title">
        <h2 id="m-title">${esc(title)}</h2><div class="modal-body">${html}</div>
        <div class="modal-actions">${actions.map((a, i) => `<button class="btn ${a.kind || ""}" data-m="${i}">${esc(a.label)}</button>`).join("")}</div></div></div>`;
      const close = v => { root.innerHTML = ""; document.removeEventListener("keydown", onKey, true); if (prev && prev.focus) prev.focus(); resolve(v); };
      const onKey = e => { if (e.key === "Escape" && dismissable !== false) { e.stopPropagation(); close(undefined); } };
      document.addEventListener("keydown", onKey, true);
      root.querySelector(".modal").addEventListener("click", e => { const b = e.target.closest("[data-m]"); if (b) close(actions[+b.dataset.m].value); });
      const btns = root.querySelectorAll("[data-m]");
      btns[btns.length - 1].focus();
    });
  }
  function confirmBox(title, text, okLabel, danger) {
    return modal({ title, html: `<p>${esc(text)}</p>`, actions: [{ label: "Cancel", value: false }, { label: okLabel || "OK", kind: danger ? "danger" : "primary", value: true }] });
  }
  function download(name, mime, text) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: mime }));
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }

  // ---------- navigation ----------
  const VIEWS = { today: viewToday, supplements: viewSupplements, results: viewResults, advisor: viewAdvisor, profile: viewProfile, settings: viewSettings };
  function currentRoute() { const r = (location.hash || "").replace("#", ""); return VIEWS[r] ? r : "today"; }
  function render() {
    S.route = currentRoute();
    $("#view").innerHTML = VIEWS[S.route]();
    $$("#nav a").forEach(a => { if (a.dataset.route === S.route) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    document.title = (NAV.find(n => n[0] === S.route) || [0, ""])[1] + " – Dose";
    const plan = $(".dayplan");
    if (plan && !S.introPlayed) { plan.classList.add("intro"); S.introPlayed = true; }
    if (S.route === "profile") updateMedRecog();
  }
  function navHtml() { return NAV.map(([id, label]) => `<a href="#${id}" data-route="${id}">${ICON[id]}<span>${label}</span></a>`).join(""); }

  // =====================================================================
  // TODAY
  // =====================================================================
  function viewToday() {
    const d = Store.data;
    const active = d.supplements.filter(U.isActive);
    const dateStr = new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
    const sched = Engine.schedule(d);
    S.sched = sched.items;
    if (!d.supplements.length && !d.labs.length && !d.exams.length) {
      return `<section class="empty-hero">
        <h1>${esc(dateStr)}</h1>
        <p class="lead">Add what you take and your latest results. Dose builds your daily plan, checks amounts, timing and interactions – including with your medication – and tells you which check-ups are due.</p>
        <div class="actions"><button class="btn primary" data-action="new-supp">Add your first supplement</button><a class="btn" href="#results">Add lab results</a><a class="btn" href="#profile">Fill in your profile</a></div>
        <p class="muted small">Just looking? <button class="linklike" data-action="load-sample">Load sample data</button></p>
      </section>`;
    }
    const res = Engine.analyze(d);
    const crit = res.findings.filter(f => f.sev === "danger" || f.sev === "warn" || f.sev === "timing");
    const countTxt = active.length === 1 ? "1 active supplement" : `${active.length} active supplements`;
    const critTxt = crit.length ? `${crit.length === 1 ? "One thing needs" : crit.length + " things need"} your attention.` : "No conflicts found.";
    const dueNow = sched.items.filter(i => i.status !== "planned");
    return `<header class="page-head">
        <div><h1>${esc(dateStr)}</h1><p class="lead">${countTxt}. ${critTxt}</p></div>
        <button class="btn primary" data-action="new-supp">${ICON.plus}<span>Supplement</span></button>
      </header>
      ${active.length ? dayPlan(active, res.findings) : `<p class="empty">No active supplements. <button class="linklike" data-action="new-supp">Add one</button></p>`}
      ${findingsSection(res.findings, "Notes")}
      ${dueNow.length ? `<section class="block"><h2>What's due</h2>${dueList(dueNow.slice(0, 4))}${dueNow.length > 4 || sched.items.length > dueNow.length ? `<p class="small"><a href="#results">See the full schedule</a></p>` : ""}</section>` : ""}
      ${totalsSection(res.totals)}
      ${durationSection(active)}`;
  }
  function dayPlan(active, findings) {
    const flags = {};
    findings.forEach(f => {
      if (!(f.sev === "danger" || f.sev === "warn" || f.sev === "timing")) return;
      (f.supps || []).forEach(id => {
        const cur = flags[id];
        if (!cur) flags[id] = { sev: f.sev, n: 1 };
        else { cur.n++; if (Engine.SEV_ORDER[f.sev] < Engine.SEV_ORDER[cur.sev]) cur.sev = f.sev; }
      });
    });
    const cols = KB.slots.map((sl, i) => {
      const items = active.filter(s => (s.slots || []).includes(sl.id));
      return `<div class="slot" style="--slot:${slotVar(sl.id)};--i:${i}">
        <div class="slot-head"><h3 class="slot-name">${esc(sl.label)}</h3>${sl.hint ? `<span class="slot-hint">${esc(sl.hint)}</span>` : ""}</div>
        ${items.length ? `<ul class="slot-items">${items.map(s => doseItem(s, flags[s.id])).join("")}</ul>` : `<p class="slot-empty">Nothing planned</p>`}
      </div>`;
    }).join("");
    const loose = active.filter(s => !(s.slots || []).length);
    return `<section class="dayplan" aria-label="Daily plan">${cols}</section>
      ${loose.length ? `<section class="loose"><h3>No set time</h3><ul class="slot-items">${loose.map(s => doseItem(s, flags[s.id])).join("")}</ul></section>` : ""}`;
  }
  function doseItem(s, flag) {
    const ing = ingSummary(s, 3);
    return `<li><button class="dose" data-action="edit-supp" data-id="${esc(s.id)}">
      <span class="dose-top"><span class="dose-name">${esc(U.suppName(s))}</span>${flag ? `<span class="flag flag-${flag.sev}" title="${flag.n} ${flag.n === 1 ? "note" : "notes"}: ${SEV[flag.sev]}">${flag.n}</span>` : ""}</span>
      <span class="dose-amt">${esc(doseText(s, true))}</span>
      ${ing ? `<span class="dose-ing">${esc(ing)}</span>` : ""}
    </button></li>`;
  }
  function findingItem(f, compact) {
    const supps = compact ? [] : (f.supps || []).map(id => Store.data.supplements.find(s => s.id === id)).filter(Boolean);
    return `<li class="finding f-${f.sev}">
      <div class="f-meta">${sevChip(f.sev)}${f.tag ? `<span class="f-tag">${esc(f.tag)}</span>` : ""}</div>
      <p class="f-title">${esc(f.title)}</p>
      <p class="f-text">${esc(f.text)}</p>
      ${supps.length ? `<div class="f-supps">${supps.map(s => `<button class="tag-btn" data-action="edit-supp" data-id="${esc(s.id)}">${esc(U.suppName(s))}</button>`).join("")}</div>` : ""}
    </li>`;
  }
  function findingsSection(findings, title, emptyText) {
    const main = findings.filter(f => f.sev === "danger" || f.sev === "warn" || f.sev === "timing");
    const rest = findings.filter(f => f.sev === "info" || f.sev === "good");
    if (!findings.length && emptyText === null) return "";
    return `<section class="block"><h2>${esc(title)}</h2>
      ${main.length ? `<ul class="findings">${main.map(f => findingItem(f)).join("")}</ul>` : `<p class="allgood">${esc(emptyText || "No conflicts in amounts, timing or interactions.")}</p>`}
      ${rest.length ? `<details class="more"><summary>More notes and good combinations (${rest.length})</summary><ul class="findings">${rest.map(f => findingItem(f)).join("")}</ul></details>` : ""}
    </section>`;
  }
  function totalsSection(totals) {
    const rows = [];
    totals.forEach(e => { if (e.total > 0 || e.unconverted) rows.push({ e, ul: Engine.effectiveUL(e) }); });
    if (!rows.length) return "";
    rows.sort((a, b) => ((b.ul ? b.e.total / b.ul.value : -1) - (a.ul ? a.e.total / a.ul.value : -1)) || a.e.name.localeCompare(b.e.name, "en"));
    return `<section class="block"><h2>Daily amounts</h2>
      <p class="muted small">Total from all active supplements. For limits marked “incl. food”, your diet adds to this.</p>
      <div class="totals">${rows.map(({ e, ul }) => totalRow(e, ul)).join("")}</div></section>`;
  }
  function totalRow(e, ul) {
    const pct = ul ? e.total / ul.value : null;
    const state = pct == null ? "none" : pct > 1 ? "over" : pct >= 0.8 ? "near" : "ok";
    const w = pct == null ? 0 : Math.min(pct, 1.5) / 1.5 * 100;
    return `<div class="trow t-${state}">
      <div class="t-name">${esc(e.name)}${e.unknown ? ` <span class="muted small">not in the database</span>` : ""}</div>
      <div class="t-val">${U.fmt(e.total)} ${esc(e.unit)}</div>
      ${ul ? `<div class="t-bar" role="img" aria-label="${Math.round(pct * 100)} percent of the limit"><span style="width:${w.toFixed(1)}%"></span><i></i></div>
        <div class="t-ul">${UL_SHORT[ul.kind]} ${U.fmt(ul.value)} ${esc(e.unit)} ${ul.scope === "total" ? "incl. food" : "from supplements"}</div>`
        : `<div class="t-ul muted">${e.nut ? "No official limit" : ""}</div>`}
    </div>`;
  }
  function durationSection(active) {
    const now = new Date();
    const rows = active.filter(s => s.startDate).map(s => {
      const start = U.parseDate(s.startDate);
      if (!start || isNaN(start)) return "";
      const days = Math.floor((now - start) / 864e5);
      const dur = U.parseNum(s.durationWeeks);
      if (days < 0) return `<li><span class="d-name">${esc(U.suppName(s))}</span><span class="d-txt">starts ${esc(U.fmtDate(s.startDate))}</span></li>`;
      const weeks = Math.floor(days / 7);
      if (!dur) return `<li><span class="d-name">${esc(U.suppName(s))}</span><span class="d-txt">for ${weeks === 1 ? "1 week" : weeks + " weeks"}, no planned end</span></li>`;
      const pct = Math.min(1, days / (dur * 7));
      return `<li><span class="d-name">${esc(U.suppName(s))}</span><span class="d-txt">${pct >= 1 ? "planned duration reached" : `week ${weeks + 1} of ${U.fmt(dur)}`}</span>
        <span class="d-bar${pct >= 1 ? " done" : ""}"><span style="width:${(pct * 100).toFixed(1)}%"></span></span></li>`;
    }).filter(Boolean);
    return rows.length ? `<section class="block"><h2>Durations</h2><ul class="durations">${rows.join("")}</ul></section>` : "";
  }

  // ---------- schedule list ----------
  function relTime(days) {
    if (days < 14) return days === 1 ? "1 day" : days + " days";
    if (days < 60) return Math.round(days / 7) + " weeks";
    const m = Math.round(days / 30.4);
    return m === 1 ? "1 month" : m + " months";
  }
  function dueText(it) {
    if (it.status === "urgent" || it.status === "due") return "now";
    if (it.status === "overdue") return "since " + monthYear(it.due);
    return `${monthYear(it.due)}, in ${relTime(it.days)}`;
  }
  function dueList(items) {
    return `<ul class="due-list">${items.map(it => {
      const idx = S.sched.indexOf(it);
      return `<li class="due d-${it.status}">
        <div class="due-when"><span class="due-chip">${STATUS[it.status]}</span><span class="due-date">${esc(dueText(it))}</span></div>
        <div class="due-main"><p class="due-title">${esc(it.title)} <span class="due-cat">${esc(it.cat)}</span></p><p class="due-why">${esc(it.why)}</p>
          <p class="due-last">${it.last ? "Last: " + esc(U.fmtDate(it.last)) : "No record yet"}</p></div>
        <button class="btn small ghost" data-action="ics" data-i="${idx}" aria-label="Add ${esc(it.title)} to calendar">${ICON.calendar}<span>Calendar</span></button>
      </li>`;
    }).join("")}</ul>`;
  }
  function downloadIcs(it) {
    if (!it) return;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const d = it.due < today ? today : it.due;
    const pad = n => String(n).padStart(2, "0");
    const ymd = x => `${x.getFullYear()}${pad(x.getMonth() + 1)}${pad(x.getDate())}`;
    const next = new Date(d); next.setDate(next.getDate() + 1);
    const e = s => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
    const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Dose//EN", "BEGIN:VEVENT", `UID:${Store.uid()}@dose`,
      `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, "").split(".")[0]}Z`, `DTSTART;VALUE=DATE:${ymd(d)}`, `DTEND;VALUE=DATE:${ymd(next)}`,
      `SUMMARY:${e("Check-up: " + it.title)}`, `DESCRIPTION:${e(it.why)}`, "END:VEVENT", "END:VCALENDAR"].join("\r\n");
    download("dose-" + U.norm(it.title).slice(0, 30) + ".ics", "text/calendar", ics);
  }

  function viewSupplements() {
    const list = Store.data.supplements;

  function suppRow(s) {

        <span class="sr-ing">${esc(ingSummary(s, 5) || "No ingredients entered")}</span></span>

  }

  // =====================================================================
  // RESULTS
  // =====================================================================
  function viewResults() {
    const d = Store.data;
    const sched = Engine.schedule(d);
    S.sched = sched.items;
    const res = Engine.analyze(d);
    const labFindings = res.findings.filter(f => f.tag === "Results");
    const hist = res.labs;
    const head = `<header class="page-head"><div><h1>Results</h1><p class="lead">Lab values, examinations and the check-ups that are due next.</p></div>
      <div class="head-actions"><button class="btn primary" data-action="new-panel">${ICON.plus}<span>Lab results</span></button><button class="btn" data-action="new-exam">${ICON.plus}<span>Examination</span></button></div></header>`;
    const missing = [];
    if (sched.missingAge) missing.push("year of birth");
    if (sched.missingSex) missing.push("sex");
    const schedHtml = `<section class="block"><h2>What's due</h2>
      ${missing.length ? `<p class="notice small">Add your ${missing.join(" and ")} in your <a href="#profile">profile</a> to include age- and sex-specific screenings.</p>` : ""}
      ${sched.items.length ? dueList(sched.items) : `<p class="muted">Nothing due right now.</p>`}
      <p class="muted small">Screening intervals follow common international guidelines; programs differ by country. Your doctor's recommendation always comes first – enter it as “next appointment” on an examination.</p>
    </section>`;
    const findHtml = hist.size ? findingsSection(labFindings, "What your results mean", "No values outside their ranges.") : "";
    return head + schedHtml + findHtml + markersSection(hist) + examsSection() + panelsSection();
  }
  function spark(h) {
    const pts = h.entries.map(e => (e.canon != null ? e.canon : e.raw)).filter(v => v != null);
    if (pts.length < 2) return "";
    const W = 88, H = 26, p = 3;
    let min = Math.min.apply(null, pts), max = Math.max.apply(null, pts);
    if (max === min) { max += 1; min -= 1; }
    const x = i => p + i * (W - 2 * p) / (pts.length - 1);
    const y = v => H - p - (v - min) * (H - 2 * p) / (max - min);
    const path = pts.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(" ");
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${path}"/><circle cx="${x(pts.length - 1).toFixed(1)}" cy="${y(pts[pts.length - 1]).toFixed(1)}" r="2.4"/></svg>`;
  }
  function markersSection(hist) {
    if (!hist.size) return `<section class="block"><h2>Lab values</h2><p class="empty">No lab results yet. <button class="linklike" data-action="new-panel">Add your latest blood test</button>${AI.hasKey() ? " – you can also scan the report." : "."}</p></section>`;
    const sex = sexKey();
    const groups = {};
    hist.forEach(h => { const c = h.marker ? h.marker.cat : "Other values"; (groups[c] = groups[c] || []).push(h); });
    const order = KB.markerCategories.concat(["Other values"]).filter(c => groups[c]);
    return `<section class="block"><h2>Lab values</h2>${order.map(c => `<h3 class="cat-head">${esc(c)}</h3><div class="markers">${groups[c].map(h => {
      const l = h.last;
      const ref = h.marker ? Engine.refFor(h.marker, sex) : null;
      const tgt = h.marker ? Engine.targetFor(h.marker, sex) : null;
      const rows = h.entries.slice().reverse().map(e => `<tr><td>${esc(U.fmtDate(e.date))}</td><td class="num">${esc(e.item.value)} ${esc(e.unit)}${convNote(h.marker, e)}</td>
        <td>${esc(labRange(e.item))}</td><td>${lvChip(e.level)}</td>
        <td><button class="linklike small" data-action="edit-panel" data-id="${esc(e.panelId)}">Edit</button></td></tr>`).join("");
      return `<details class="marker" data-key="${esc(h.key)}"><summary>
          <span class="mk-name">${esc(h.name)}</span>
          <span class="mk-val">${esc(l.item.value)} ${esc(l.unit)}</span>
          <span class="mk-lv">${lvChip(l.level)}</span>
          <span class="mk-spark">${spark(h)}</span>
          <span class="mk-date">${esc(U.fmtDate(l.date))}</span></summary>
        <div class="mk-body">
          ${h.marker && h.marker.about ? `<p>${esc(h.marker.about)}</p>` : ""}
          ${h.marker ? (() => { const t = refText(h.marker, l.unit) || (ref ? rangeStr(ref, h.marker.unit) : ""); return t ? `<p class="small muted">App reference: ${esc(t)}. Your lab's own range takes priority.</p>` : ""; })() : ""}
          ${tgt && tgt.text ? `<p class="small muted">${esc(tgt.text)}</p>` : ""}
          <div class="tablewrap"><table class="hist"><thead><tr><th>Date</th><th>Value</th><th>Lab range</th><th>Assessment</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
        </div></details>`;
    }).join("")}</div>`).join("")}</section>`;
  }
  function examsSection() {
    const ex = Store.data.exams.slice().sort((a, b) => ((a.date || "") < (b.date || "") ? 1 : -1));
    return `<section class="block"><h2>Examinations</h2>${ex.length ? `<ul class="rec-list">${ex.map(e => `<li><button class="rec-row" data-action="edit-exam" data-id="${esc(e.id)}">
        <span class="rec-date">${esc(U.fmtDate(e.date))}</span>
        <span class="rec-main"><span class="rec-title">${esc(examName(e))}</span>${e.summary ? `<span class="rec-sub">${esc(shorten(e.summary, 120))}</span>` : ""}</span>
        <span class="rec-side"><span class="res res-${esc(e.result || "normal")}">${esc(RESULT[e.result] || "No findings")}</span>${e.nextDue ? `<span class="muted small">Next: ${esc(U.fmtDate(e.nextDue))}</span>` : ""}</span>
      </button></li>`).join("")}</ul>` : `<p class="empty">No examinations yet. <button class="linklike" data-action="new-exam">Add a check-up, dental visit or screening</button></p>`}</section>`;
  }
  function panelsSection() {
    const ps = Store.data.labs.slice().sort((a, b) => ((a.date || "") < (b.date || "") ? 1 : -1));
    if (!ps.length) return "";
    return `<section class="block"><h2>Lab reports</h2><ul class="rec-list">${ps.map(p => {
      const n = (p.items || []).filter(i => String(i.name || "").trim()).length;
      return `<li><button class="rec-row" data-action="edit-panel" data-id="${esc(p.id)}">
        <span class="rec-date">${esc(U.fmtDate(p.date))}</span>
        <span class="rec-main"><span class="rec-title">${esc(p.source || "Lab report")}</span><span class="rec-sub">${n} ${n === 1 ? "value" : "values"}</span></span>
      </button></li>`;
    }).join("")}</ul></section>`;
  }

  // =====================================================================
  // SHEETS (supplement, lab report, examination)
  // =====================================================================
  function openSheet(kind, id) {
    const list = kind === "supp" ? Store.data.supplements : kind === "panel" ? Store.data.labs : Store.data.exams;
    const existing = id && list.find(x => x.id === id);
    let draft;
    if (existing) draft = JSON.parse(JSON.stringify(existing));
    else if (kind === "supp") draft = { id: Store.uid(), brand: "", product: "", form: "Capsule", serving: "1 capsule", servingsPerDay: "1", slots: [], ingredients: [emptyIng()], purpose: "", startDate: todayLocal(), durationWeeks: "", status: "active", notes: "" };
    else if (kind === "panel") draft = { id: Store.uid(), date: todayLocal(), source: "", notes: "", items: [emptyLabItem(), emptyLabItem(), emptyLabItem()] };
    else draft = { id: Store.uid(), date: todayLocal(), type: "General check-up", customType: "", result: "normal", summary: "", nextDue: "" };
    if (kind === "supp" && !draft.ingredients.length) draft.ingredients.push(emptyIng());
    if (kind === "panel" && !draft.items.length) draft.items.push(emptyLabItem());
    S.sheet = { kind, draft, orig: JSON.stringify(draft), isNew: !existing, ai: null, aiBusy: false, aiError: null, scanBusy: false, scanError: null };
    S.lastFocus = document.activeElement;
    renderSheet();
    document.body.classList.add("noscroll");
    const first = $(S.sheet.isNew ? ".sheet-body input:not([type=file]), .sheet-body select" : ".sheet-head .icon-btn");
    if (first) first.focus({ preventScroll: true });
  }
  async function closeSheet(force) {
    if (!S.sheet) return;
    if (!force && JSON.stringify(S.sheet.draft) !== S.sheet.orig) {
      const ok = await confirmBox("Discard changes?", "You have unsaved changes.", "Discard", true);
      if (!ok) return;
    }
    S.sheet = null;
    $("#sheet-root").innerHTML = "";
    document.body.classList.remove("noscroll");
    if (S.lastFocus && document.body.contains(S.lastFocus)) S.lastFocus.focus({ preventScroll: true });
  }
  function renderSheet() {
    const sh = S.sheet;
    const titles = { supp: ["New supplement", "Edit supplement"], panel: ["New lab results", "Edit lab results"], exam: ["New examination", "Edit examination"] };
    $("#sheet-root").innerHTML = `<div class="backdrop" data-action="backdrop"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
      <header class="sheet-head"><h2 id="sh-title">${titles[sh.kind][sh.isNew ? 0 : 1]}</h2>
        <button class="icon-btn" data-action="close-sheet" aria-label="Close">${ICON.close}</button></header>
      <div class="sheet-body" id="sh-body">${sheetBody()}</div>
      <footer class="sheet-foot">
        ${sh.isNew ? "" : `<button class="btn danger-ghost" data-action="delete-sheet">Delete</button>`}
        <span class="spacer"></span>
        ${sh.kind === "supp" ? `<button class="btn" data-action="ai-check"${AI.hasKey() ? "" : ' disabled title="Add an API key under Settings first"'}>Check with AI</button>` : ""}
        <button class="btn primary" data-action="save-sheet">Save</button>
      </footer></div></div>`;
  }
  function sheetBody() { return S.sheet.kind === "supp" ? suppBody() : S.sheet.kind === "panel" ? panelBody() : examBody(); }
  function rerenderBody() { const b = $("#sh-body"); if (b) b.innerHTML = sheetBody(); }

  function matchInfo(ing) {
    if (!String(ing.name || "").trim()) return { cls: "", html: "" };

    return n ? { cls: "ok", html: `Recognized: ${esc(n.name)}` } : { cls: "unknown", html: "Not in the database – saved and assessed by the AI" };
  }
  function ingRow(ing, i) {
    const m = matchInfo(ing);
    const units = KB.units.includes(ing.unit) ? KB.units : KB.units.concat([ing.unit]);
    return `<div class="ing-row">
      <label class="ing-name"><span class="sr-only">Ingredient</span><input list="nutrient-list" data-dbind="ingredients.${i}.name" value="${esc(ing.name)}" placeholder="Ingredient, e.g. Magnesium" autocomplete="off"></label>

      <label class="ing-unit"><span class="sr-only">Unit</span><select data-dbind="ingredients.${i}.unit">${units.map(u => opt(u, u, ing.unit)).join("")}</select></label>

  function suggestBox() {
    const d = S.sheet.draft;
    const sug = Engine.suggestSlots(d, Store.data);
    if (!sug) return `<p class="hint">Enter ingredients and Dose suggests a good time of day.</p>`;
    const nuts = U.suppNutrients(d);
    const same = sug.length === d.slots.length && sug.every(x => d.slots.includes(x));
    return `<div class="suggest">
      <div class="suggest-line"><p><span class="muted">Suggested:</span> <strong>${esc(sug.map(slotLabel).join(" and "))}</strong>${same ? " – that's what's set." : ""}</p>
      ${same ? "" : `<button class="btn small" data-action="apply-suggest" data-slots="${sug.join(",")}">Use this</button>`}</div>
      <ul class="tips">${nuts.map(n => `<li><strong>${esc(n.name)}:</strong> ${esc(n.timing || "")}</li>`).join("")}</ul>
    </div>`;

  function suppPreview() {

  // ----- lab report -----
  function labRange(it) {
    const lo = String(it.refLow || "").trim(), hi = String(it.refHigh || "").trim();
    return lo && hi ? lo + "–" + hi : hi ? "up to " + hi : lo ? "from " + lo : "–";
  }
  function labSystem() { return Store.data.profile.labUnits === "conventional" ? "conventional" : "si"; }
  function rangeStr(r, u) {
    if (r[0] != null && r[1] != null) return `${U.fmt(r[0])}–${U.fmt(r[1])} ${u}`;
    if (r[1] != null) return `up to ${U.fmt(r[1])} ${u}`;
    if (r[0] != null) return `from ${U.fmt(r[0])} ${u}`;
    return "";
  }
  function refText(m, unit) {
    const u = String(unit || "").trim() || m.unit;
    if (m.unitRef) { const k = Object.keys(m.unitRef).find(x => Engine.sameUnit(x, u)); if (k) return rangeStr(m.unitRef[k], u); }
    const ref = Engine.refFor(m, sexKey());
    if (!ref) return "";
    const lo = ref[0] != null ? Engine.fromCanon(m, ref[0], u) : null, hi = ref[1] != null ? Engine.fromCanon(m, ref[1], u) : null;
    if ((ref[0] != null && lo == null) || (ref[1] != null && hi == null)) return "";
    return rangeStr([lo, hi], u);
  }
  function convNote(m, e) {
    if (!m || e.canon == null) return "";
    const pu = Engine.preferredUnit(m, labSystem());
    if (Engine.sameUnit(e.unit || m.unit, pu)) return "";
    const v = Engine.fromCanon(m, e.canon, pu);
    return v == null ? "" : ` <span class="muted small">≈ ${U.fmt(v)} ${esc(pu)}</span>`;
  }
  function labItemInfo(it) {
    if (!String(it.name || "").trim()) return "";
    const m = Engine.matchMarker(it.name);
    const ev = Engine.evaluate(m, it, sexKey());
    const hasLab = String(it.refLow || "").trim() || String(it.refHigh || "").trim();
    let note = "";
    if (!m) note = hasLab ? "Not in the app's list – rated with your lab's range" : "Not in the app's list – add your lab's range to rate it";
    else if (!Engine.unitKnown(m, it.unit)) note = hasLab ? "Unit unknown to the app – rated with your lab's range" : "Unit unknown for this test – pick one from the list or add your lab's range";
    else if (!hasLab && String(it.value || "").trim()) { const r = refText(m, it.unit); if (r) note = "App range " + r; }
    return `${m ? `<span class="ok">${esc(m.name)}</span>` : ""} ${lvChip(ev.level)} ${note ? `<span class="muted">${esc(note)}</span>` : ""}`;
  }
  function unitControl(it, i) {
    const m = Engine.matchMarker(it.name);
    if (m && !it.unitCustom && Engine.unitKnown(m, it.unit)) {
      const units = Engine.markerUnits(m, labSystem());
      const sel = units.find(u => Engine.sameUnit(u, it.unit)) || units[0];
      return `<select data-dbind="items.${i}.unit" aria-label="Unit">${units.map(u => opt(u, u, sel)).join("")}<option value="__other">Other unit…</option></select>`;
    }
    return `<input list="labunit-list" data-dbind="items.${i}.unit" value="${esc(it.unit)}" placeholder="Unit" autocomplete="off" aria-label="Unit">`;
  }
  function renderUnitCell(i, focus) {
    const it = S.sheet.draft.items[i], cell = $("#li-unit-" + i);
    if (!cell) return;
    const m = Engine.matchMarker(it.name);
    cell.dataset.mk = m ? m.id : "";
    cell.innerHTML = unitControl(it, i);
    if (focus) { const f = cell.querySelector("input,select"); if (f) f.focus(); }
  }

  function updateSuppPreview() {
    if (!S.sheet || S.sheet.kind !== "supp") return;
    const p = $("#ed-preview");
    if (p) {
      const open = $$("details[open]", p).map(x => x.dataset.know);
      p.innerHTML = suppPreview();
      open.forEach(id => { const el = $(`details[data-know="${id}"]`, p); if (el) el.open = true; });
    }
    const sg = $("#ed-suggest");
    if (sg) sg.innerHTML = suggestBox();
  }
  function schedulePreview() { clearTimeout(S.pvTimer); S.pvTimer = setTimeout(updateSuppPreview, 250); }
  function onDraftInput(el) {
    const sh = S.sheet;
    const path = el.dataset.dbind;
    setPath(sh.draft, path, el.value);
    if (sh.kind === "supp") {
      const m = /^ingredients\.(\d+)\.name$/.exec(path);
      if (m) {
        const i = +m[1], ing = sh.draft.ingredients[i], info = matchInfo(ing);
        const box = $("#ing-match-" + i);
        if (box) { box.innerHTML = info.html; box.className = "ing-match " + info.cls; }
        const n = Engine.matchNutrient(ing.name);
        if (n && (ing.amount === "" || ing.amount == null) && ing.unit !== n.unit) {
          ing.unit = n.unit;
          const sel = $(`[data-dbind="ingredients.${i}.unit"]`);
          if (sel) { if (!$$("option", sel).some(o => o.value === n.unit)) sel.insertAdjacentHTML("beforeend", opt(n.unit, n.unit)); sel.value = n.unit; }
        }
      }
      schedulePreview();
    } else if (sh.kind === "panel") {
      const m = /^items\.(\d+)\.(\w+)$/.exec(path);
      if (m) {
        const i = +m[1], it = sh.draft.items[i];
        if (m[2] === "unit" && el.value === "__other") { it.unit = ""; it.unitCustom = true; renderUnitCell(i, true); }
        if (m[2] === "name") {
          const mk = Engine.matchMarker(it.name), cell = $("#li-unit-" + i);
          if (cell && cell.dataset.mk !== (mk ? mk.id : "")) {
            if (mk && (!String(it.unit || "").trim() || !Engine.unitKnown(mk, it.unit))) { it.unit = Engine.preferredUnit(mk, labSystem()); it.unitCustom = false; }
            renderUnitCell(i);
          }
        }
        const box = $("#li-match-" + i);
        if (box) box.innerHTML = labItemInfo(it);
      }
    } else if (sh.kind === "exam" && path === "type") rerenderBody();
  }
  function saveSheet() {
    const sh = S.sheet, d = sh.draft;
    const clean = JSON.parse(JSON.stringify(d));
    let list;
    if (sh.kind === "supp") {
      if (!String(d.product || "").trim() && !String(d.brand || "").trim()) { toast("Give the supplement a name.", "error"); const f = $('[data-dbind="product"]'); if (f) f.focus(); return; }
      clean.ingredients = clean.ingredients.filter(i => String(i.name || "").trim());
      list = Store.data.supplements;
    } else if (sh.kind === "panel") {
      if (!d.date) { toast("Enter the date of the blood test.", "error"); return; }
      clean.items = clean.items.filter(i => String(i.name || "").trim()).map(i => { delete i.unitCustom; return i; });
      if (!clean.items.length) { toast("Enter at least one value.", "error"); return; }
      list = Store.data.labs;
    } else {
      if (!d.date) { toast("Enter the date of the examination.", "error"); return; }
      list = Store.data.exams;
    }
    const idx = list.findIndex(x => x.id === clean.id);
    if (idx >= 0) list[idx] = clean; else list.push(clean);
    Store.save();
    closeSheet(true);
    toast("Saved");
    render();
  }
  async function deleteSheet() {
    const sh = S.sheet;
    const what = sh.kind === "supp" ? `“${U.suppName(sh.draft)}” will be removed. If you only stop for a while, set the status to “Paused” instead.` : sh.kind === "panel" ? "This lab report and all its values will be removed." : "This examination will be removed.";
    if (!(await confirmBox("Delete?", what, "Delete", true))) return;
    const key = sh.kind === "supp" ? "supplements" : sh.kind === "panel" ? "labs" : "exams";
    Store.data[key] = Store.data[key].filter(x => x.id !== sh.draft.id);
    Store.save();
    closeSheet(true);
    toast("Deleted");
    render();
  }
  function addReport(r) {
    const rep = Object.assign({ id: Store.uid(), date: new Date().toISOString(), model: AI.model() }, r);
    Store.data.reports.unshift(rep);
    Store.data.reports = Store.data.reports.slice(0, 40);
    Store.save();
    return rep;
  }
  async function aiCheck() {
    const sh = S.sheet;
    if (!sh || sh.aiBusy) return;
    const d = sh.draft;
    if (!d.ingredients.some(i => String(i.name || "").trim())) { toast("Enter the ingredients first.", "error"); return; }
    sh.aiBusy = true; sh.aiError = null;
    const box = $("#ed-ai");
    box.innerHTML = suppAi();
    box.scrollIntoView({ behavior: "smooth", block: "start" });
    try {
      const text = await AI.checkProduct(Store.data, d, Engine.diff(Store.data, d));
      sh.ai = text;
      addReport({ type: "check", title: "Supplement check: " + U.suppName(d), question: "", content: text });
    } catch (e) { sh.aiError = e.message; }
    finally { sh.aiBusy = false; if (S.sheet === sh) { const b = $("#ed-ai"); if (b) b.innerHTML = suppAi(); } }
  }
  function fileToDataUrl(file, max) {
    if (file.type === "application/pdf") {
      if (file.size > 20 * 1024 * 1024) return Promise.reject(new Error("The PDF is too large (max. 20 MB)."));
      return new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = () => reject(new Error("The PDF couldn't be read.")); r.readAsDataURL(file); });
    }
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.88));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("The image couldn't be opened. Use a JPG or PNG photo.")); };
      img.src = url;
    });
  }
  function applyLabel(r) {
    const d = S.sheet.draft;
    if (r.brand && !String(d.brand).trim()) d.brand = String(r.brand);
    if (r.product && !String(d.product).trim()) d.product = String(r.product);
    if (r.form && KB.forms.includes(r.form)) d.form = r.form;
    if (r.serving) d.serving = String(r.serving);
    if (r.servingsPerDay) d.servingsPerDay = String(r.servingsPerDay);
    const ings = (r.ingredients || []).filter(i => i && i.name).map(i => {
      const unit = Engine.normUnit(i.unit), nut = Engine.matchNutrient(i.name);
      return { name: String(i.name), form: i.form ? String(i.form) : "", amount: i.amount != null ? String(i.amount) : "", unit: KB.units.includes(unit) ? unit : (nut ? nut.unit : "mg") };
    });
    if (ings.length) d.ingredients = ings;
    if (!d.slots.length) { const sug = Engine.suggestSlots(d, Store.data); if (sug) d.slots = sug; }
  }
  function applyReport(r) {
    const d = S.sheet.draft;
    if (r.date && /^\d{4}-\d{2}-\d{2}$/.test(r.date)) d.date = r.date;
    if (r.source && !String(d.source).trim()) d.source = String(r.source);
    const items = (r.items || []).filter(i => i && i.name).map(i => ({ id: Store.uid(), name: String(i.name), value: i.value != null ? String(i.value) : "", unit: i.unit ? String(i.unit) : "", refLow: i.refLow != null ? String(i.refLow) : "", refHigh: i.refHigh != null ? String(i.refHigh) : "" }));
    const kept = d.items.filter(i => String(i.name || "").trim());
    if (items.length) d.items = kept.concat(items);
  }
  async function scanFile(file) {
    const sh = S.sheet;
    if (!file || !sh) return;
    sh.scanBusy = true; sh.scanError = null;
    rerenderBody();
    try {
      const url = await fileToDataUrl(file, sh.kind === "panel" ? 2200 : 1600);
      if (sh.kind === "panel") { const r = await AI.readLabReport(url); if (S.sheet !== sh) return; applyReport(r); toast(`${(r.items || []).length} values read – please check them`); }
      else { const r = await AI.readLabel(url); if (S.sheet !== sh) return; applyLabel(r); toast("Label read – please check the values"); }
    } catch (e) { sh.scanError = e.message; }
    finally { sh.scanBusy = false; if (S.sheet === sh) rerenderBody(); }
  }

  async function runAi(kind) {
    if (S.busy) return;
    const q = (S.askDraft || "").trim();
    if (kind === "ask" && !q) { toast("Briefly describe your concern.", "error"); const t = $("#ask-text"); if (t) t.focus(); return; }
    if (kind === "results" && !Store.data.labs.length && !Store.data.exams.length) { toast("Add lab results or examinations under Results first.", "error"); return; }
    S.busy = { ask: "The AI is preparing your recommendations", results: "The AI is reviewing your results", plan: "The AI is checking your plan" }[kind];
    S.aiError = null;
    render();
    const st = $("#ai-status"); if (st) st.scrollIntoView({ behavior: "smooth", block: "center" });
    let rep = null;
    try {
      const text = kind === "ask" ? await AI.solveProblem(Store.data, q) : kind === "results" ? await AI.reviewResults(Store.data) : await AI.analyzePlan(Store.data);
      rep = addReport({ type: kind, title: kind === "ask" ? shorten(q, 80) : kind === "results" ? "Results review" : "Plan check", question: kind === "ask" ? q : "", content: text });
      S.openReport = rep.id;
      if (kind === "ask") S.askDraft = "";
    } catch (e) { S.aiError = e.message; }
    finally {
      S.busy = null;
      if (S.route === "advisor" && !S.sheet) {
        render();
        if (rep) { const el = $(`[data-report="${rep.id}"]`); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }
      } else if (rep) toast("Report ready – see Advisor");
      else if (S.aiError) toast(S.aiError, "error");
    }
  }

    if (!g.owner) missing.push("username");

      case "li-del": sh.draft.items.splice(+el.dataset.i, 1); if (!sh.draft.items.length) sh.draft.items.push(emptyLabItem()); $("#li-list").innerHTML = sh.draft.items.map(labItemRow).join(""); break;
      case "apply-suggest":
        sh.draft.slots = el.dataset.slots.split(",");
        $$("[data-dslot]").forEach(cb => { cb.checked = sh.draft.slots.includes(cb.dataset.dslot); });
        updateSuppPreview();
        break;
      case "ics": downloadIcs(S.sched[+el.dataset.i]); break;
      case "med-add": Store.data.profile.medications.push({ id: Store.uid(), name: "", dose: "", slot: "" }); Store.save(); render(); focusLast('[data-bind^="profile.medications"][data-bind$=".name"]'); break;
      case "med-del": flushSave(); Store.data.profile.medications.splice(+el.dataset.i, 1); Store.save(); render(); break;
      case "ask-fill": { S.askDraft = el.dataset.q + ". "; const t = $("#ask-text"); if (t) { t.value = S.askDraft; t.focus(); t.setSelectionRange(t.value.length, t.value.length); } break; }
      case "ai-ask": runAi("ask"); break;
      case "ai-results": runAi("results"); break;
      case "ai-plan": runAi("plan"); break;
      case "report-del":
        if (!(await confirmBox("Delete report?", "The report will be removed permanently.", "Delete", true))) return;

  function focusLast(sel) { const els = $$(sel); if (els.length) els[els.length - 1].focus(); }

  function onField(e) {
    const el = e.target;
    if (!el || !el.dataset) return;
    const tag = el.tagName;
    const isText = (tag === "INPUT" && !["checkbox", "radio", "file", "date"].includes(el.type)) || tag === "TEXTAREA";
    if (e.type === "input" && !isText) return;
    if (e.type === "change" && isText) return;
    if (el.dataset.bind) {
      setPath(Store.data, el.dataset.bind, el.value);
      scheduleSave();
      if (el.dataset.bind.indexOf("profile.medications") === 0) updateMedRecog();
    } else if (el.dataset.bindSet) {
      const v = el.value;
      const next = (getPath(Store.data, el.dataset.bindSet) || []).filter(x => x !== v);
      if (el.checked) next.push(v);
      setPath(Store.data, el.dataset.bindSet, next);
      scheduleSave();
    } else if (el.dataset.dbind && S.sheet) {
      onDraftInput(el);
    } else if (el.dataset.dslot !== undefined && S.sheet) {
      const set = new Set(S.sheet.draft.slots);
      if (el.checked) set.add(el.dataset.dslot); else set.delete(el.dataset.dslot);
      S.sheet.draft.slots = KB.slots.map(s => s.id).filter(x => set.has(x));
      schedulePreview();
    } else if (el.dataset.sbind) {
      const p = el.dataset.sbind;
      setPath(Store.settings, p, el.value);
      Store.saveSettings();
      if (p === "gh.owner" || p === "gh.repo") Store.resetSync();
      if (p === "model") render();
    } else if (el.id === "ask-text") {
      S.askDraft = el.value;
    } else if (el.matches("[data-scan]")) {
      const f = el.files && el.files[0]; el.value = ""; scanFile(f);
    } else if (el.matches("[data-import]")) {
      const f = el.files && el.files[0]; el.value = ""; importData(f);
    }
  }
  document.addEventListener("input", onField);
  document.addEventListener("change", onField);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && S.sheet && !$("#modal-root").innerHTML) { e.preventDefault(); closeSheet(false); } });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushSave(); });
  window.addEventListener("pagehide", flushSave);
  window.addEventListener("hashchange", () => { flushSave(); render(); window.scrollTo(0, 0); });

  // =====================================================================
  // START
  // =====================================================================
  function init() {
    Store.load();
    const nutrientNames = Array.from(new Set(KB.nutrients.map(n => n.name).concat(["Vitamin D3", "Vitamin K2", "EPA", "DHA", "Folic acid", "Methylfolate"])));
    const units = Array.from(new Set(KB.markers.reduce((acc, m) => acc.concat([m.unit], (m.alt || []).map(a => a.u), Object.keys(m.unitRef || {})), [])));
    const dl = document.createElement("div");
    dl.innerHTML = `<datalist id="nutrient-list">${nutrientNames.map(n => `<option value="${esc(n)}"></option>`).join("")}</datalist>
      <datalist id="marker-list">${KB.markers.map(m => `<option value="${esc(m.name)}"></option>`).join("")}</datalist>
      <datalist id="labunit-list">${units.map(u => `<option value="${esc(u)}"></option>`).join("")}</datalist>`;
    document.body.appendChild(dl);
    $("#nav").innerHTML = navHtml();
    render();
    Sync.onStatus(updateSyncUi);
    Sync.onConflict = ({ local, remote }) => modal({
      title: "Two different versions",
      html: `<p>Since the last sync, changes were made both on this device and on another one.</p>
        <ul class="plain"><li>This device: ${esc(fmtDateTime(local))}</li><li>Cloud: ${esc(fmtDateTime(remote))}</li></ul>
        <p>Which version do you want to keep? The other one will be overwritten.</p>`,
      actions: [{ label: "This device", value: "local" }, { label: "Cloud version", value: "remote", kind: "primary" }],
      dismissable: false
    });
    Sync.onAdopt = () => {
      if (!S.sheet && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) render();
      toast("Loaded the latest data from your other device");
    };
    Sync.init();
    updateSyncUi();
  }
  init();
})();

</script>
</body>
</html>
